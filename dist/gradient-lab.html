<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Gradient Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Afacad:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Gradient Lab — pale-blue/white direction from the approved references. Proposed tokens;
   contrast verified for text/actions (see VALIDATION.md). */
:root {
  --bg: #f0f8fd; --surface: #ffffff; --surface-2: #f3f8fc; --ink: #09223d; --muted: #52657c;
  --border: #dce8f1; --action: #0870b0; --on-action: #ffffff; --action-soft: #e3f2fc; --accent: #5bbdf5;
  --line: #e0313f; --pa: #1d6fe0; --pb: #8a3fd6; --run: #0870b0; --rise: #0a8754; --tri: #fff1b8;
  --ref: #7d8c9b; --plot: #ffffff; --grid: #e6eef5; --grid-major: #d3e1ec; --track: #e3ebf2;
  --ok: #0a7a4a; --ok-bg: #e5f6ec; --ok-bd: #6cc394;
  --warn-bg: #fff6d6; --warn-bd: #e3bb3f; --warn-ink: #6b4d00;
  --info-bg: #e7f2fd; --info-bd: #7db8e8;
  --bad: #b3261e; --bad-bg: #fde9e8; --bad-bd: #e69089;
  --radius: 22px; --fast: 130ms; --panel: 280ms; --ease: cubic-bezier(.22, .8, .22, 1);
  --shadow: 0 1px 2px rgba(9, 34, 61, .04), 0 6px 24px rgba(9, 34, 61, .05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1b29; --surface: #162839; --surface-2: #1d3247; --ink: #eef5fb; --muted: #a9bdd0;
    --border: #2c455c; --action: #6cc4f5; --on-action: #06223a; --action-soft: #1f3d57; --accent: #6cc4f5;
    --line: #ff6470; --pa: #6aa6ff; --pb: #c194f7; --run: #6cbcf2; --rise: #45d197; --tri: rgba(255, 214, 102, .2);
    --ref: #8ea2b5; --plot: #132434; --grid: #20354a; --grid-major: #2b445c; --track: #2a4157;
    --ok: #59d69a; --ok-bg: #143628; --ok-bd: #2f8a5e;
    --warn-bg: #3a3117; --warn-bd: #9b7d22; --warn-ink: #f6dd92;
    --info-bg: #172f47; --info-bd: #3f79a8;
    --bad: #ff8a80; --bad-bg: #3d1d1d; --bad-bd: #9c4a45;
    --shadow: none; color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 Manrope, "Segoe UI", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .brand, .equation, .display { font-family: Afacad, Manrope, "Segoe UI", system-ui, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { min-height: 44px; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--action); outline-offset: 3px; border-radius: 10px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 12px; top: -60px; background: var(--action); color: var(--on-action); padding: 10px 14px; border-radius: 10px; z-index: 100; }
.skip-link:focus { top: 12px; }
.nowrap { white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- Header ---------- */
#app { min-height: 100dvh; display: flex; flex-direction: column; transform-origin: 0 0; }
.topbar { height: 76px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 0 28px; }
.brand { justify-self: start; font-size: 32px; font-weight: 700; letter-spacing: -.01em; background: none; border: 0; color: var(--ink); padding: 0 6px; }
.tabs { position: relative; display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); }
.tab-ind { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px; background: var(--action); opacity: 0;
  transition: transform 220ms var(--ease), width 220ms var(--ease), opacity 150ms; }
.tab { position: relative; z-index: 1; border: 0; background: none; border-radius: 999px; padding: 0 18px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; transition: color 150ms; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--on-action); }
.tab-count { font-size: 12.5px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.tab[aria-current="page"] .tab-count { background: rgba(255, 255, 255, .22); color: inherit; }
.tools { justify-self: end; display: flex; gap: 10px; }
.icon-btn { width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); display: grid; place-items: center; padding: 0; transition: transform var(--fast), background 150ms; }
.icon-btn:active { transform: scale(.97); }
.icon-btn[aria-pressed="true"] { background: var(--action-soft); border-color: var(--action); }
.icon-btn svg { width: 22px; height: 22px; }

main { flex: 1; min-height: 0; padding: 0 28px 24px; }

/* ---------- Buttons ---------- */
.btn { border-radius: 12px; padding: 10px 20px; font-weight: 700; border: 1.5px solid transparent; transition: transform var(--fast), background 150ms, border-color 150ms; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.primary { background: var(--action); color: var(--on-action); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn.secondary { background: var(--surface); color: var(--action); border-color: color-mix(in srgb, var(--action) 55%, var(--border)); }
.btn.secondary:hover { background: var(--action-soft); }
.btn.quiet { background: none; color: var(--muted); border-color: var(--border); font-weight: 600; }
.btn.pill { border-radius: 999px; }
.btn:disabled { opacity: .5; }
.btn.wide { width: 100%; }
.link-btn { background: none; border: 0; color: var(--action); font-weight: 700; padding: 6px 2px; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
.link-btn svg { width: 18px; height: 18px; }

/* ---------- Welcome ---------- */
.welcome { min-height: calc(100dvh - 76px - 24px); display: grid; grid-template-columns: minmax(240px, 34%) 1fr; align-items: center; gap: 12px; max-width: 1400px; margin: 0 auto; }
.welcome-fitila { justify-self: stretch; align-self: end; min-width: 0; display: flex; flex-direction: column; align-items: center; padding-bottom: 4vh; }
.welcome-fitila .fitila-btn { width: 100%; height: auto; display: flex; justify-content: center; }
/* Width-bounded: the clip's frame can never be wider than Fitila's own column, so its
   background never slides over the level cards. Cards also sit above it as a safety net. */
.welcome-fitila .fitila-stage { height: auto; width: min(100%, calc(64vh * 828 / 720), 644px); }
.welcome-copy { position: relative; z-index: 1; min-width: 0; }
.welcome-copy { padding-right: 8px; }
.welcome h1 { font-size: clamp(32px, 4.2vw, 56px); line-height: 1.05; margin: 0 0 10px; letter-spacing: -.015em; text-align: center; }
.welcome .sub { font-size: clamp(20px, 2vw, 28px); color: var(--muted); margin: 0 0 32px; text-align: center; font-family: Afacad, Manrope, system-ui, sans-serif; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.card { background: var(--surface); border-radius: var(--radius); padding: 28px 22px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: var(--shadow); border: 1px solid var(--border); }
.card img { width: 104px; height: 104px; margin-bottom: 18px; }
.card h2 { margin: 0; font-size: 28px; }
.card p { margin: 4px 0 22px; color: var(--muted); font-size: 18px; }
.card .btn { width: 100%; border-radius: 999px; min-height: 52px; font-size: 18px; }
.welcome-bubble { margin: 0 0 10px; }

/* ---------- Workspace ---------- */
.workspace { height: calc(100dvh - 76px - 24px); min-height: 560px; display: grid; grid-template-columns: auto minmax(500px, 1fr); gap: 22px; }
.graph-card { height: 100%; aspect-ratio: 1 / 1; max-width: calc(100vw - 56px - 22px - 500px); /* the panel keeps at least 500px */ min-width: 0; background: var(--surface); border-radius: var(--radius); padding: 12px 12px 6px; display: flex; flex-direction: column; box-shadow: var(--shadow); border: 1px solid var(--border); }
#graph { flex: 1; min-height: 0; width: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.graph-caption { min-height: 28px; margin: 0; text-align: center; color: var(--muted); font-size: 15px; font-weight: 600; padding: 2px 8px 4px; }
.panel-card { position: relative; min-width: 0; min-height: 0; background: var(--surface); border-radius: var(--radius); display: grid; grid-template-columns: minmax(0, 1fr) 136px; box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; }
.panel-scroll { min-height: 0; overflow: auto; padding: 22px 8px 22px 28px; scrollbar-width: thin; display: flex; flex-direction: column; gap: 12px; }
.panel-card::after { content: ""; position: absolute; left: 0; right: 136px; bottom: 0; height: 36px; pointer-events: none; opacity: 0; transition: opacity 200ms;
  background: linear-gradient(to bottom, transparent, var(--surface)); }
.panel-card.more::after { opacity: 1; }
.mascot-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 16px 8px 14px; gap: 8px; }

/* ---------- Graph SVG ---------- */
.plot-bg { fill: var(--plot); }
.grid { stroke: var(--grid); stroke-width: 1; }
.grid.major { stroke: var(--grid-major); }
.axis { stroke: var(--ink); stroke-width: 2.2; }
.axis-head { fill: var(--ink); }
.tick { stroke: var(--ink); stroke-width: 1.5; }
.tick-label { fill: var(--muted); font-family: Manrope, system-ui, sans-serif; font-weight: 600; }
.tick-label { transition: opacity 160ms ease; } .tick-label.yield { opacity: 0; }
.axis-label { fill: var(--ink); font-style: italic; font-weight: 700; font-family: Manrope, system-ui, sans-serif; }
.main-line { stroke: var(--line); stroke-width: 3.5; stroke-linecap: round; }
.main-line.thick { stroke-width: 9; }
.ref-line { stroke: var(--ref); stroke-width: 2.5; stroke-dasharray: 9 7; }
.tri { fill: var(--tri); }
.run-seg { stroke: var(--run); stroke-width: 4; stroke-linecap: round; }
.rise-seg { stroke: var(--rise); stroke-width: 4; stroke-linecap: round; }
.run-label { fill: var(--run); font-weight: 800; font-size: 17px; font-family: Manrope, system-ui, sans-serif; paint-order: stroke; stroke: var(--plot); stroke-width: 5px; stroke-linejoin: round; }
.rise-label { fill: var(--rise); font-weight: 800; font-size: 17px; font-family: Manrope, system-ui, sans-serif; paint-order: stroke; stroke: var(--plot); stroke-width: 5px; stroke-linejoin: round; }
.int-dot { fill: var(--surface); stroke: var(--line); stroke-width: 3; }
.int-label, .pt-label, .target-label { font-weight: 800; font-size: 16px; font-family: Manrope, system-ui, sans-serif; paint-order: stroke; stroke: var(--plot); stroke-width: 5px; stroke-linejoin: round; }
.int-label { fill: var(--line); }
.hiker { fill: var(--pa); stroke: var(--plot); stroke-width: 3; }
.pt { cursor: grab; outline: none; }
.pt:active { cursor: grabbing; }
.pt .hit { fill: transparent; }
.pt .ring { fill: none; stroke: var(--action); stroke-width: 3; opacity: 0; }
.pt:focus-visible .ring, .pt.dragging .ring { opacity: 1; }
.pt-a .mark { fill: var(--pa); stroke: var(--plot); stroke-width: 3; }
.pt-b .mark { fill: var(--pb); stroke: var(--plot); stroke-width: 3; }
.pt-a .pt-label { fill: var(--pa); } .pt-b .pt-label { fill: var(--pb); }
.pt-dot { fill: var(--pa); stroke: var(--plot); stroke-width: 4; }
.target { fill: none; stroke: var(--muted); stroke-width: 3.5; }
.target.hit { stroke: var(--ok); stroke-width: 4.5; }
.target-core { fill: var(--muted); }
.target-core.hit { fill: var(--ok); }
.target-check { stroke: var(--ok); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.target-label { fill: var(--muted); } .target-label.hit { fill: var(--ok); }
.hidden-graph .grid, .hidden-graph .tick-label { opacity: .45; }
.anim .trace { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: trace 300ms var(--ease) forwards; }
.anim .trace.second { animation-delay: 300ms; }
@keyframes trace { to { stroke-dashoffset: 0; } }
.mini-graph { width: 100%; max-width: 230px; display: block; border-radius: 12px; border: 1px solid var(--border); }

/* ---------- Panel content ---------- */
.lvl-head { display: flex; flex-direction: column; gap: 8px; }
.lvl-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.lvl-title { margin: 0; font-size: 34px; line-height: 1.05; letter-spacing: -.01em; }
.lvl-sub { margin: 0; color: var(--muted); font-size: 16px; }
.mission-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.mission-of { color: var(--muted); font-weight: 600; font-size: 15px; }
.strip { display: flex; gap: 6px; flex-wrap: wrap; }
.strip button { width: 40px; min-height: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface-2); font-weight: 700; color: var(--muted); padding: 0; position: relative; }
@media (pointer: coarse) { .strip button { width: 44px; height: 44px; min-height: 44px; } }
.strip button[aria-current="step"] { border-color: var(--action); color: var(--action); background: var(--surface); box-shadow: inset 0 0 0 1px var(--action); }
.strip button.done { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-bd); }
.strip button.done::after { content: "✓"; position: absolute; top: -7px; right: -6px; width: 17px; height: 17px; border-radius: 50%; background: var(--ok); color: var(--surface); font-size: 11px; line-height: 17px; text-align: center; }
.mission-card { background: var(--surface-2); border-radius: 16px; padding: 14px 18px 8px; border: 1.5px solid transparent; transition: border-color 200ms, background 200ms; }
.mission-card.cue { border-color: var(--action); }
.mission-text { margin: 0; font-weight: 700; font-size: 19px; line-height: 1.35; }
.mission-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.done-tag { font-size: 14px; color: var(--ok); font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.notes { display: flex; flex-direction: column; gap: 10px; }
.notes:empty { display: none; }
.note { border-radius: 14px; padding: 12px 16px 14px; border: 1.5px solid; position: relative; }
.note h3 { margin: 0 0 4px; font-size: 19px; display: flex; align-items: center; gap: 8px; }
.note h3 svg { width: 20px; height: 20px; flex: none; }
.note p { margin: 4px 0; }
.note .close { position: absolute; top: 4px; right: 4px; width: 40px; min-height: 40px; height: 40px; border: 0; background: none; border-radius: 10px; color: inherit; font-size: 22px; line-height: 1; }
.note.hint { background: var(--warn-bg); border-color: var(--warn-bd); }
.note.hint h3 { color: var(--warn-ink); }
.note.info { background: var(--info-bg); border-color: var(--info-bd); }
.note.ok { background: var(--ok-bg); border-color: var(--ok-bd); }
.note.ok h3 { color: var(--ok); }
.note.bad { background: var(--bad-bg); border-color: var(--bad-bd); }
.note.bad h3 { color: var(--bad); }
.note .btn { margin-top: 10px; }
.note-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.check-draw path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw 250ms var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.equation { background: var(--surface-2); border-radius: 16px; padding: 10px 16px; text-align: center; font-size: 40px; font-weight: 700; line-height: 54px; min-height: 74px; display: block; white-space: nowrap; overflow-x: auto; }
.equation i, .working i, .q i, .formula i { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 600; }
.eq-m, .eq-c { border-radius: 8px; transition: background 250ms; padding: 0 2px; }
.flash { background: var(--action-soft); }
.equation.small { font-size: 28px; min-height: 56px; line-height: 40px; }
.slider { display: grid; gap: 0; border-radius: 14px; padding: 4px 6px; margin: 0 -6px; transition: box-shadow 200ms, background 200ms; }
.slider.cue { box-shadow: 0 0 0 2px var(--action); background: var(--action-soft); }
.slider-top { display: flex; align-items: center; justify-content: space-between; }
.slider-top label { font-size: 17px; font-weight: 600; }
.slider-top label b { font-family: Georgia, serif; font-style: italic; font-size: 19px; }
.slider output { min-width: 56px; text-align: center; padding: 2px 10px; border-radius: 10px; border: 1px solid var(--border); font-weight: 700; font-size: 18px; background: var(--surface); }
.slider-body { display: grid; grid-template-columns: 28px 1fr 28px; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; font-weight: 600; }
.slider-body span:last-child { text-align: right; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 40px; background: transparent; margin: 0; --fill: 50%; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: linear-gradient(to right, var(--accent) var(--fill), var(--track) var(--fill)); }
input[type=range]::-moz-range-track { height: 8px; border-radius: 99px; background: linear-gradient(to right, var(--accent) var(--fill), var(--track) var(--fill)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -10px; border-radius: 50%; background: var(--action); border: 4px solid var(--surface); box-shadow: 0 1px 5px rgba(9, 34, 61, .3); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--action); border: 4px solid var(--surface); box-shadow: 0 1px 5px rgba(9, 34, 61, .3); }
input[type=range]:focus-visible { outline-offset: 0; }
.summary { margin: 0; color: var(--muted); font-size: 15.5px; }
/* the equation and its plain-words summary share one card */
.eq-card { background: var(--surface-2); border-radius: 16px; padding: 2px 16px 8px; display: grid; }
.eq-card .equation { background: none; border-radius: 0; padding: 4px 0 0; min-height: 0; }
.eq-card .summary { text-align: center; font-size: 14.5px; line-height: 1.35; }
.eq-card .summary:empty { display: none; }
/* mission success: title and its action share the top row, the explanation runs full width below */
.note.ok:has(> .ok-row) { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 12px; }
.note.ok:has(> .ok-row) > h3 { grid-row: 1; grid-column: 1; margin: 0; }
.note.ok > .ok-row { display: contents; }
.ok-row > div { grid-row: 2; grid-column: 1 / -1; }
.note .ok-row > .btn { grid-row: 1; grid-column: 2; margin: 0; min-height: 38px; padding: 6px 16px; }
/* desktop: point chips on one line (the x =, y = restatement stays for screen readers via the label) */
@media (min-width: 900px) { .point-chips .chip small { display: none; } .point-chips .chip { min-height: 44px; padding: 6px 14px; } }
/* once a prediction is answered, its question line folds away */
.working.answered .predict-q { display: none; }
/* a hint asked for after success: the success note keeps just its title and action */
.notes:has(> .note.hint) .note.ok .ok-row > div { display: none; }
/* the two disclosures share a row */
.disc-row { display: flex; gap: 8px; position: relative; }
.disc-row > details { flex: 1 1 0; min-width: 0; }
.disc-row > details[open] > summary { border-color: var(--action); }
/* desktop: an open disclosure floats just above its row instead of pushing the panel taller */
@media (min-width: 900px) {
  .disc-row > details[open] > .disclosure-body { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 6;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px 14px;
    box-shadow: 0 14px 40px rgba(9, 34, 61, .18); }
  .anim .disc-row > details[open] > .disclosure-body { animation: popUp 320ms var(--spring) both; transform-origin: 50% 100%; }
}
/* a closable note keeps its text clear of the close button */
.note:has(> .close) { padding-right: 40px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1 1 160px; }

details.disclosure { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
details.disclosure > summary { list-style: none; cursor: pointer; min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-weight: 700; border-radius: 14px; }
details.disclosure > summary::-webkit-details-marker { display: none; }
details.disclosure > summary svg { width: 18px; height: 18px; transition: transform 200ms; }
details[open].disclosure > summary svg { transform: rotate(90deg); }
.disclosure-body { padding: 2px 16px 14px; }
.check { display: flex; align-items: center; gap: 12px; min-height: 44px; font-weight: 600; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--action); margin: 0; }
.why-list { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

.point-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chip { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-radius: 14px; background: var(--surface-2); border: 1.5px solid transparent; text-align: left; min-height: 56px; }
.chip:hover { border-color: var(--border); }
.chip .sw { width: 16px; height: 16px; flex: none; }
.chip .sw.a { border-radius: 50%; background: var(--pa); }
.chip .sw.b { border-radius: 3px; background: var(--pb); transform: rotate(45deg); }
.chip b { font-size: 18px; }
.chip small { display: block; color: var(--muted); font-size: 13.5px; }
.toggles { display: flex; gap: 6px 22px; flex-wrap: wrap; }

/* ---------- Fitila ---------- */
.fitila-btn { position: relative; border: 0; background: none; padding: 0; width: 120px; height: 160px; display: flex; align-items: flex-end; justify-content: center; border-radius: 18px; }
.fitila-btn img { display: block; max-width: 100%; max-height: 100%; pointer-events: none; transform-origin: 50% 100%; user-select: none; -webkit-user-drag: none; }
/* Fitila motion comes from approved video clips only (see playClip). Stills never bob,
   wiggle or float: interaction feedback is the focus ring plus the clip itself. */
.fitila-btn:focus-visible { outline-offset: 4px; }
.fitila-btn:active { transform: scale(.98); }
.fitila-stage { position: relative; display: block; aspect-ratio: 828 / 720; height: 100%;
  /* clips sit on the exact app colour; a soft edge hides any 1-level decoder rounding */
  -webkit-mask-image: linear-gradient(to right, transparent, #000 4%, #000 96%, transparent), linear-gradient(to bottom, transparent, #000 4%, #000 96%, transparent);
  -webkit-mask-composite: source-in; mask-composite: intersect; }
.corner-stage { aspect-ratio: 3 / 4; transform: scaleX(-1); } /* mirrored: she faces the workspace */
.corner-stage.celebrating { aspect-ratio: 1241 / 1396; margin: 0 -11px; flex: none; }
.fitila-btn { overflow: visible; }
.dialog-stage { aspect-ratio: 1440 / 1394; height: 220px; margin: 0 auto; }
.dialog .fitila-stage img { height: 100%; }
.fitila-stage img, .fitila-stage .fitila-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; -webkit-user-drag: none; }
.fitila-stage.video-on img { visibility: hidden; }

.cue-bubble { background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 8px 12px; font-weight: 700; font-size: 14.5px; box-shadow: var(--shadow); position: relative; text-align: center; }
.cue-bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 14px; height: 14px; background: inherit; border-right: 1.5px solid var(--border); border-bottom: 1.5px solid var(--border); transform: translateX(-50%) rotate(45deg); }
.anim .cue-bubble { animation: fadeUp 300ms var(--ease) both; }

/* ---------- Entry choreography ---------- */
.anim .enter { animation: fadeUp 300ms var(--ease) both; }
.anim .enter-2 { animation-delay: 140ms; }
.anim .enter-3 { animation-delay: 300ms; }
.anim .enter-4 { animation-delay: 440ms; }
.anim .enter-5 { animation-delay: 580ms; }
.anim .enter { animation-duration: 460ms; }
/* Staged level entry */
.staged-out { display: none !important; }
.anim .stage-in { animation: stageIn 440ms var(--ease) both; }
@keyframes stageIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.lvl-title-row .scores { grid-template-columns: repeat(4, auto); gap: 6px; }
.lvl-title-row .score { padding: 4px 10px; display: flex; align-items: baseline; gap: 6px; }
.lvl-title-row .score b { display: inline; font-size: 18px; }
.type-picker > summary span { font-weight: 600; }
.type-picker > summary b { font-weight: 800; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.anim .note-in { animation: noteIn 280ms var(--ease) both; }
@keyframes noteIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* ---------- Overlays ---------- */
.scrim { position: fixed; inset: 0; background: rgba(9, 34, 61, .32); display: grid; place-items: center; z-index: 50; padding: 16px; }
.anim .scrim { animation: fade 250ms ease both; }

/* Opener: approved splash look. Always navy (the fly-in clip is generated on #0E1B29). The clip
   is blended with `lighten` so the faint rings beneath show through its flat backdrop. */
.opener { position: fixed; inset: 0; z-index: 80; background: #0E1B29; overflow: hidden; color-scheme: dark; }
.op-box { position: absolute; left: 50%; top: 50%; width: max(100vw, 177.78vh); aspect-ratio: 16 / 9; translate: -50% -50%;
  container-type: inline-size; transform-origin: 40% 55%; }
.op-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; mix-blend-mode: lighten;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 7%), linear-gradient(to right, transparent, #000 5%);
  mask-image: linear-gradient(to bottom, transparent, #000 7%), linear-gradient(to right, transparent, #000 5%);
  -webkit-mask-composite: source-in; mask-composite: intersect; }
.op-rings { position: absolute; inset: 0; opacity: 0; scale: .94; }
.op-rings i, .op-rings b { position: absolute; left: 50%; top: 53%; aspect-ratio: 1; border-radius: 50%; translate: -50% -50%;
  border: 1px solid rgba(150, 195, 255, .07); background: radial-gradient(circle, transparent 58%, rgba(70, 130, 205, .075)); }
.op-rings i:nth-child(1) { width: 38cqw; } .op-rings i:nth-child(2) { width: 58cqw; } .op-rings i:nth-child(3) { width: 82cqw; }
.op-rings b { width: 64cqw; top: 112%; border-color: rgba(150, 195, 255, .10); background: radial-gradient(circle, transparent 62%, rgba(70, 130, 205, .06)); }
.op-glow { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: 0;
  background: radial-gradient(ellipse 30% 40% at 58% 52%, rgba(46, 108, 186, .30), transparent 70%); }
.op-brand { position: absolute; left: 52.5%; top: 52%; translate: 0 -50%; display: flex; flex-direction: column; align-items: stretch; opacity: 0; }
.op-plate { background: #fff; border-radius: clamp(12px, 1.3cqw, 22px); padding: clamp(10px, 1.15cqw, 20px) clamp(16px, 1.8cqw, 30px);
  box-shadow: 0 1.4cqw 3.4cqw rgba(0, 0, 0, .38), 0 0 0 1px rgba(255, 255, 255, .5) inset; }
.op-plate img { display: block; height: clamp(24px, 2.6cqw, 44px); width: auto; }
.op-line { margin-top: clamp(10px, 1.3cqw, 22px); height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.op-line i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #53C4F0, #8FD2C8 55%, #F2C46B); }
.opener .opener-skip { position: fixed; right: 24px; bottom: 24px; color: #fff; background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .28); }
.opener .opener-skip:hover { background: rgba(255, 255, 255, .16); }
/* timeline: rings breathe in, slow camera push; on landing the logo glides in and the line fills */
.opener.play .op-rings, .opener.still .op-rings { opacity: 1; scale: 1; transition: opacity 1.4s ease, scale 2.4s var(--ease); }
.opener.play .op-box { scale: 1.035; transition: scale 7.5s cubic-bezier(.25, .6, .3, 1); }
.opener.landed .op-glow { opacity: 1; transition: opacity 1.4s ease; }
.op-brand { translate: 2.4cqw -50%; filter: blur(8px); }
.opener.landed .op-brand { opacity: 1; translate: 0 -50%; filter: none; transition: opacity .7s ease, translate 1.1s var(--ease), filter .8s ease; }
.opener.landed .op-line i { width: 100%; transition: width 3s cubic-bezier(.45, 0, .2, 1) .35s; }
.opener.still .op-brand, .opener.still .op-glow { transition: none; }
.opener.still .op-line i { width: 100%; transition: none; }
.opener.out { opacity: 0; transition: opacity 600ms ease; }
.opener.out .op-brand { translate: 0 -54%; transition: translate .6s ease; }
/* portrait: frame on Fitila, logo beneath her */
@media (max-aspect-ratio: 1 / 1) {
  .op-box { width: 190vw; left: calc(50% + 26.6vw); top: 44%; }
  .op-rings i, .op-rings b { left: 36%; } .op-rings b { top: 118%; }
  .op-glow { background: radial-gradient(ellipse 22% 40% at 36% 70%, rgba(46, 108, 186, .30), transparent 70%); }
  .op-brand { left: 36%; top: 92%; translate: -50% 1.6cqw; }
  .opener.landed .op-brand { translate: -50% 0; }
  .opener.out .op-brand { translate: -50% -.8cqw; }
  .op-plate img { height: clamp(26px, 3.6cqw, 40px); }
}

.a-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: nowrap; }
.a-actions { display: flex; gap: 6px; flex: none; }
.a-toolbar .scores { display: flex; gap: 3px; flex: none; }
.a-toolbar .score { padding: 3px 5px; border-radius: 9px; display: flex; align-items: baseline; gap: 4px; }
.a-toolbar .score b { display: inline; font-size: 16px; }
.a-toolbar .score span { font-size: 11.5px; }

/* =====================================================================================
   Motion system: CleanMyMac-style springs — stretch, overshoot, settle. Everything here is
   gated by .anim (reduced motion off). The graph itself stays anchored (pack requirement).
   ===================================================================================== */
:root {
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --spring-soft: cubic-bezier(.3, 1.3, .6, 1);
  --squish: cubic-bezier(.2, .9, .3, 1.2);
}
@supports (animation-timing-function: linear(0, 1)) {
  :root {
    --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1.004 83.8%, 1);
    --spring-soft: linear(0, .02, .08 3.5%, .33 9%, .74 17%, .96 23%, 1.04 29%, 1.06 33%, 1.05 38%, 1.01 48%, .995 58%, 1);
  }
}

/* staged entry: rise + scale on a spring, staggered by JS */
.anim .stage-in { animation: springIn 640ms var(--spring) both; transform-origin: 50% 0; }
@keyframes springIn { from { opacity: 0; transform: translateY(18px) scale(.96); } 40% { opacity: 1; } to { opacity: 1; transform: none; } }

/* welcome: heading slides, cards rise one by one, lift on hover */
.anim .welcome h1.enter { animation: springIn 720ms var(--spring) both; }
.anim .welcome .sub.enter { animation: springIn 720ms var(--spring) 120ms both; }
.anim .card.enter { animation: cardIn 820ms var(--spring) backwards; }
.anim .card.enter-3 { animation-delay: 260ms; } .anim .card.enter-4 { animation-delay: 360ms; } .anim .card.enter-5 { animation-delay: 460ms; }
@keyframes cardIn { from { opacity: 0; transform: translateY(40px) scale(.9); } 35% { opacity: 1; } to { opacity: 1; transform: none; } }
.anim .card { transition: transform 520ms var(--spring), box-shadow 300ms ease; }
.anim .card:hover { transform: translateY(-6px) scale(1.015); box-shadow: 0 18px 40px rgba(9, 34, 61, .10); }

/* buttons: squish on press, spring back on release */
.anim .btn, .anim .tab, .anim .strip button, .anim .types button, .anim .icon-btn, .anim .chip, .anim .fitila-btn {
  transition: transform 460ms var(--spring), background-color 160ms, border-color 160ms, color 160ms, box-shadow 200ms; }
.anim .btn:active:not(:disabled), .anim .tab:active, .anim .strip button:active, .anim .types button:active,
.anim .icon-btn:active, .anim .chip:active { transform: scale(.93); transition-duration: 90ms; }
.anim .fitila-btn:active { transform: scale(.95); transition-duration: 90ms; }

/* tab indicator: JS drives a stretch (leading edge first, trailing edge catches up) */
.anim .tab-ind { transition: opacity 150ms; }

/* notes pop in with a little stretch */
.anim .note-in { animation: notePop 560ms var(--spring) both; transform-origin: 50% 0; }
@keyframes notePop { from { opacity: 0; transform: translateY(-8px) scale(.94, .9); } 45% { opacity: 1; } to { opacity: 1; transform: none; } }
.anim .note.ok.note-in { animation-name: successPop; }
@keyframes successPop { from { opacity: 0; transform: scale(.9, .8); } 40% { opacity: 1; transform: scale(1.03, .98); } 70% { transform: scale(.99, 1.01); } to { opacity: 1; transform: none; } }

/* completed mission: the check badge bounces in */
.anim .strip button.done.just-done { animation: doneBounce 700ms var(--spring); }
.anim .strip button.done.just-done::after { animation: badgePop 700ms var(--spring); }
@keyframes doneBounce { 0% { transform: scale(.85); } 100% { transform: none; } }
@keyframes badgePop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

/* changed equation term bounces; score numbers pop */
.anim .flash { animation: termBounce 520ms var(--spring); display: inline-block; }
@keyframes termBounce { 0% { transform: scale(1); } 30% { transform: scale(1.14); } 100% { transform: scale(1); } }
.anim .score b.pop { animation: termBounce 560ms var(--spring); display: inline-block; }

/* wrong answer: a gentle shake (never punishing) */
.anim .shake { animation: shake 420ms cubic-bezier(.36, .07, .19, .97); }
@keyframes shake { 15%, 85% { transform: translateX(-2px); } 30%, 70% { transform: translateX(4px); } 45%, 55% { transform: translateX(-5px); } }

/* popovers / disclosures open on a spring */
.anim details[open] > .disclosure-body { animation: popoverIn 420ms var(--spring) both; transform-origin: 0 0; }
@keyframes popUp { from { opacity: 0; transform: translateY(8px) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes popoverIn { from { opacity: 0; transform: translateY(-6px) scale(.92); } to { opacity: 1; transform: none; } }

/* dragged points squash on drop */
.anim .pt.dropped .mark { animation: squash 520ms var(--spring); transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes squash { 0% { transform: scale(1.35, .75); } 100% { transform: none; } }
.anim .pt-b.dropped .mark { animation-name: squashB; }
@keyframes squashB { 0% { transform: rotate(45deg) scale(1.35, .75); } 100% { transform: rotate(45deg); } }

/* targets hit: ring springs */
.anim .target.hit { animation: termBounce 560ms var(--spring); transform-box: fill-box; transform-origin: 50% 50%; }

/* =====================================================================================
   Walkthrough: spotlight, caption bar, word-by-word captions
   ===================================================================================== */
.wt-block { z-index: 0; }
.wt-ring { z-index: 1; border-radius: 18px; pointer-events: none; opacity: 0;
  box-shadow: 0 0 0 3px var(--action), 0 0 0 10px color-mix(in srgb, var(--action) 16%, transparent), 0 0 0 9999px rgba(9, 34, 61, .34);
  transition: left 620ms var(--spring), top 620ms var(--spring), width 620ms var(--spring), height 620ms var(--spring), opacity 260ms ease; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wt-ring { box-shadow: 0 0 0 3px var(--action), 0 0 0 10px color-mix(in srgb, var(--action) 18%, transparent), 0 0 0 9999px rgba(0, 0, 0, .5); } }
.wt-ring.on { opacity: 1; }
.anim .wt-ring.land { animation: ringLand 700ms var(--spring); }
@keyframes ringLand { 0% { transform: scale(1.06); } 100% { transform: scale(1); } }
.wt-guide { z-index: 2; }
.wt-cursor { z-index: 3; }

.wt-bar { z-index: 4; height: auto; min-height: 104px; padding: 18px 24px 16px; display: grid;
  grid-template-columns: minmax(150px, auto) minmax(0, 1fr) auto; align-items: center; gap: 18px;
  background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -10px 30px rgba(9, 34, 61, .08); }
.wt-progress { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 4px; padding: 0 4px; }
.wt-progress span { flex: 1; height: 4px; border-radius: 0 0 4px 4px; background: var(--track); overflow: hidden; }
.wt-progress span i { display: block; height: 100%; width: 0; background: var(--action); transition: width 120ms linear; }
.wt-progress span.done i { width: 100%; }
.wt-chip { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; justify-self: start; }
.wt-chip b { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-variant-numeric: tabular-nums; }
.wt-chip span { font-family: Afacad, Manrope, system-ui, sans-serif; font-size: 20px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.anim .wt-chip.swap span { animation: chipIn 560ms var(--spring); }
@keyframes chipIn { from { opacity: 0; transform: translateY(10px) scale(.9); } to { opacity: 1; transform: none; } }
.wt-caption { margin: 0; max-width: none; text-align: center; font-weight: 700; line-height: 1.3; font-size: 21px;
  height: 2.6em; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; align-content: center; overflow: hidden; }
.wt-caption .w { opacity: .3; transition: opacity 220ms ease, color 220ms ease; margin: 0 .14em; }
.wt-caption .w.said { opacity: 1; }
.wt-controls { display: flex; gap: 8px; justify-self: end; }
.wt-voice.attention { border-color: var(--action); color: var(--action); }
.anim .wt-voice.attention { animation: voicePulse 1.6s ease-in-out infinite; }
@keyframes voicePulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--action) 40%, transparent); } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--action) 0%, transparent); } }
.wt-step { display: none; }
@media (max-width: 899px) {
  .wt-bar { grid-template-columns: 1fr; gap: 8px; padding: 14px 14px 12px; }
  .wt-chip { flex-direction: row; align-items: baseline; gap: 8px; justify-self: center; }
  .wt-chip span { font-size: 17px; }
  .wt-caption { font-size: 17px; }
  .wt-controls { justify-self: center; flex-wrap: wrap; justify-content: center; }
}

/* Phones: let Equation Detective's toolbar and scores wrap; captions may use four lines. */
@media (max-width: 899px) {
  .a-toolbar { flex-wrap: wrap; }
  .a-toolbar .scores { flex-wrap: wrap; }
  .a-title-row .lvl-title { font-size: 24px; }
  .a-challenge, .a-controls { min-width: 0; }
  .q .nowrap { white-space: normal; }
  .wt-caption { height: 5.3em; line-height: 1.3; }
}

/* corner clip pool: only the active clip is visible */
.fitila-stage video.pool { opacity: 0; }
.fitila-stage video.pool.active { opacity: 1; }
/* reaction blends over the idle loop when she is not near her rest pose */
.fitila-stage.xfade video.pool.fading-in { animation: clipFade 200ms ease-out both; }
@keyframes clipFade { from { opacity: 0; } to { opacity: 1; } }
.fitila-stage video.pool.active { z-index: 1; }
.fitila-stage video.pool.fading-in { z-index: 2; }

<script>
"use strict";
const __math = (() => {
// Gradient Lab — mathematical core. Pure functions, no DOM. Single source of truth for
// numbers, fractions, equations and plot geometry used by every screen and by the tests.

const MINUS = '−';
const near = (a, b) => Number.isFinite(a) && Number.isFinite(b) && Math.abs(a - b) < 1e-9;

const VULGAR = { '½': 1 / 2, '⅓': 1 / 3, '⅔': 2 / 3, '¼': 1 / 4, '¾': 3 / 4 };

// Accepts whole numbers, decimals, negatives and fractions; ASCII or Unicode minus.
// Returns a finite number or null. Never uses eval. "1/0" -> null.
function parseAnswer(raw) {
  const s = String(raw ?? '').trim().replace(/[−–—]/g, '-').replace(/\s+/g, '');
  if (!s) return null;
  const vm = s.match(/^([+-]?)([½⅓⅔¼¾])$/);
  if (vm) return (vm[1] === '-' ? -1 : 1) * VULGAR[vm[2]];
  const num = '[+-]?(?:\\d+(?:\\.\\d*)?|\\.\\d+)';
  if (!new RegExp(`^${num}(?:/${num})?$`).test(s)) return null;
  const [a, b] = s.split('/').map(Number);
  if (b === 0) return null;
  const v = b === undefined ? a : a / b;
  return Number.isFinite(v) ? v : null;
}

function gcd(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) [a, b] = [b, a % b];
  return a || 1;
}

// Exact for the curriculum's rational values (denominators up to 96).
function toFrac(v) {
  if (!Number.isFinite(v)) return null;
  for (let d = 1; d <= 96; d++) {
    const n = Math.round(v * d);
    if (Math.abs(v * d - n) < 1e-7) return { n: n === 0 ? 0 : n, d };
  }
  return { n: Number(v.toFixed(6)), d: 1 };
}

// Simplify n/d with the sign moved to the top.
function simplify(n, d) {
  if (d === 0) return null;
  const g = gcd(n, d), s = d < 0 ? -1 : 1;
  return { n: (s * n) / g || 0, d: Math.abs(d) / g };
}

// ---------- Plain-text formatting (screen-reader text, aria labels) ----------
function numText(v) {
  const f = toFrac(v);
  if (!f) return 'undefined';
  const sign = f.n < 0 ? MINUS : '';
  return f.d === 1 ? sign + Math.abs(f.n) : `${sign}${Math.abs(f.n)}/${f.d}`;
}
const pointText = (p) => `(${numText(p.x)}, ${numText(p.y)})`;

function equationText(m, c) {
  if (near(m, 0)) return `y = ${numText(c)}`;
  const xTerm = near(m, 1) ? 'x' : near(m, -1) ? `${MINUS}x`
    : toFrac(m).d === 1 ? `${numText(m)}x` : `${numText(m)} x`;
  const cPart = near(c, 0) ? '' : c < 0 ? ` ${MINUS} ${numText(-c)}` : ` + ${numText(c)}`;
  return `y = ${xTerm}${cPart}`;
}

// ---------- HTML formatting (stacked fractions, Unicode minus) ----------
// Visually stacked; screen readers get "n over d".
const fracHTML = (n, d) =>
  `<span class="frac"><span class="fstack" aria-hidden="true"><span class="fn">${n}</span><span class="fd">${d}</span></span><span class="sr-only">${String(n).replace(/<[^>]+>/g, '')} over ${String(d).replace(/<[^>]+>/g, '')}</span></span>`;

// A value as HTML: integers inline, fractions stacked, sign in front.
function numHTML(v, cls = '') {
  const f = toFrac(v);
  if (!f) return 'undefined';
  const sign = f.n < 0 ? MINUS : '';
  const body = f.d === 1 ? String(Math.abs(f.n)) : fracHTML(Math.abs(f.n), f.d);
  const inner = sign + body;
  return cls ? `<span class="${cls}">${inner}</span>` : inner;
}
// Negative operands inside working are bracketed: 3 − (−1).
const brHTML = (v, cls = '') => (v < 0 ? `(${numHTML(v, cls)})` : numHTML(v, cls));
const brText = (v) => (v < 0 ? `(${numText(v)})` : numText(v));

// Equation as HTML with separately addressable m and c terms (for change highlighting).
function equationHTML(m, c) {
  if (near(m, 0)) return `<span class="eq-y">y</span> = <span class="eq-c">${numHTML(c)}</span>`;
  const coef = near(m, 1) ? '' : near(m, -1) ? MINUS : numHTML(m);
  const cPart = near(c, 0) ? '' : c < 0 ? ` ${MINUS} ${numHTML(-c)}` : ` + ${numHTML(c)}`;
  return `<span class="eq-y">y</span> = <span class="eq-m">${coef}<i>x</i></span><span class="eq-c">${cPart}</span>`;
}

// ---------- Geometry ----------
function lineThrough(a, b) {
  if (a.x === b.x && a.y === b.y) return { kind: 'coincident' };
  const dx = b.x - a.x, dy = b.y - a.y;
  if (dx === 0) return { kind: 'vertical', x: a.x, dx, dy };
  const m = dy / dx;
  return { kind: 'line', dx, dy, m, c: a.y - m * a.x };
}

// Beginner rise/run triangle: starts at (0,c); run 1 for whole m, 2 for half m; hidden at m=0.
function beginnerTriangle(m, c) {
  if (near(m, 0)) return null;
  const run = Number.isInteger(m) ? 1 : 2;
  return { run, rise: m * run, pts: [{ x: 0, y: c }, { x: run, y: c }, { x: run, y: c + m * run }] };
}

function steepness(m) {
  const a = Math.abs(m);
  return a < 1.5 ? 'gentle' : a < 3 ? 'steep' : 'very steep';
}
const direction = (m) => (m > 0 ? 'uphill' : m < 0 ? 'downhill' : 'flat');

// Plot mapping: 640-unit square viewBox, 32-unit padding, -8..8 on both axes (equal units).
const VIEW = 640, PAD = 32, STEP = (VIEW - 2 * PAD) / 16;
const px = (x) => PAD + (x + 8) * STEP;
const py = (y) => PAD + (8 - y) * STEP;
const ux = (X) => (X - PAD) / STEP - 8;
const uy = (Y) => 8 - (Y - PAD) / STEP;
const inGrid = (p, lim = 8) => Math.abs(p.x) <= lim && Math.abs(p.y) <= lim;

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

return { MINUS, near, parseAnswer, gcd, toFrac, simplify, numText, pointText, equationText, fracHTML, numHTML, brHTML, brText, equationHTML, lineThrough, beginnerTriangle, steepness, direction, VIEW, px, py, ux, uy, inGrid, clamp, PAD, STEP };
})();
const __graph = (() => {
// SVG string builders for the coordinate grid. Pure (no DOM) so they serve the live graph,
// mini example graphs and tests alike. Square plot, equal units, -8..8, numbered every 2.
const { VIEW, PAD, px, py, MINUS } = __math;
const lbl = (v) => (v < 0 ? MINUS + Math.abs(v) : String(v));

function gridSVG({ clipId, every = 2, font = 15, axisLabels = true } = {}) {
  let g = `<defs><clipPath id="${clipId}"><rect x="${PAD}" y="${PAD}" width="${VIEW - 2 * PAD}" height="${VIEW - 2 * PAD}"/></clipPath>`
    + `<marker id="${clipId}-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="axis-head"/></marker></defs>`;
  g += `<rect class="plot-bg" x="${PAD}" y="${PAD}" width="${VIEW - 2 * PAD}" height="${VIEW - 2 * PAD}"/>`;
  let lines = '';
  for (let i = -8; i <= 8; i++) {
    const cls = i % 2 === 0 ? 'grid major' : 'grid';
    lines += `<line class="${cls}" x1="${px(i)}" y1="${py(-8)}" x2="${px(i)}" y2="${py(8)}"/>`;
    lines += `<line class="${cls}" x1="${px(-8)}" y1="${py(i)}" x2="${px(8)}" y2="${py(i)}"/>`;

// One reusable <video> per host: created once (preloaded), rewound and replayed instantly.
function clipVideo(host, src) {
  let v = host.querySelector('video');
  if (v && v.dataset.src === src) return v;
  v?.remove();
  v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'auto';
  v.setAttribute('aria-hidden', 'true');
  v.className = 'fitila-video';
  v.dataset.src = src; v.src = src;
  host.appendChild(v);
  v.load();
  return v;
}
// Preload a host's clip without playing it, so the first tap reacts instantly.
function prepClip(host, name) {
  const c = clipFor(name);
  if (!reduced() && !demo?.static && c.src) clipVideo(host, c.src);
}
// Browsers may pause muted video in background/power-saving states (AbortError): keep the
// still and retry when the page is visible. Any other refusal calls fail().
function startVideo(v, fail) {
  const start = () => v.play()?.catch((e) => {
    if (!v.isConnected) return;
    if (e.name === 'AbortError' || document.hidden) {
      const again = () => { if (!document.hidden) { document.removeEventListener('visibilitychange', again); if (v.isConnected && v.paused && !v.ended) start(); } };
      document.addEventListener('visibilitychange', again);
    } else fail();
  });
  start();
}
// Plays a clip inside a .fitila-stage host (which holds a still <img>). Reduced motion, autoplay
// refusal or a load failure leave the still in place. When it ends, the video keeps showing the
// final frame (identical to the still) and stays loaded for an instant replay.
function playClip(host, name, { onEnd, loop = false } = {}) {
  const c = clipFor(name), img = host.querySelector('img');
  const still = () => { img.src = ASSET[c.last]; host.classList.remove('video-on'); host.querySelector('video')?.remove(); onEnd?.(); };
  if (reduced() || demo?.static || !c.src) return still();
  const v = clipVideo(host, c.src);
  v.loop = loop;
  v.onplaying = () => host.classList.add('video-on');
  v.onended = () => { img.src = ASSET[c.last]; onEnd?.(); };
  v.onerror = still;
  v.currentTime = 0;
  startVideo(v, still);
  return v;
}

// ---------- timers (cleared on navigation so stale feedback never plays on a new task) ----------
const timers = new Map();
function later(key, ms, fn) { clearTimeout(timers.get(key)); timers.set(key, setTimeout(() => { timers.delete(key); fn(); }, ms)); }
function cancelTimers(prefix, keep) { for (const [k, id] of timers) if (k.startsWith(prefix) && !(keep && k.startsWith(keep))) { clearTimeout(id); timers.delete(k); } }

let liveT;

}

// ---------- gentle synthesised cues (off by default; no autoplay assumption) ----------
let actx;
function chime(kind) {
  if (!state.prefs.sound || demo) return;
  try {
    actx ??= new AudioContext();
    const t = actx.currentTime, notes = kind === 'ok' ? [659.3, 880] : [523.3];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i * 0.12); g.gain.linearRampToValueAtTime(0.07, t + i * 0.12 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.12 + 0.4);
      o.connect(g).connect(actx.destination); o.start(t + i * 0.12); o.stop(t + i * 0.12 + 0.45);
    });
  } catch { /* audio unavailable: silent */ }
}

  if (!wasDone) s.completed = [...s.completed, mi.id].sort((x, y) => x - y);
  persist();
  renderChrome();
  refreshMission(lvl);
  $(`[data-mission="${mi.id}"]`)?.classList.add('just-done');
  corner.react('nod');
  chime('ok');
  announce(`Mission complete! ${plain(mi.success)}`);
  if (!wasDone && s.completed.length === MISSIONS[lvl].length && !state.session.completeShown[lvl] && !demo) {
    state.session.completeShown[lvl] = true;
    later('lvl-complete', 1100, () => levelCompleteDialog(lvl));
  }
}

const sliderHTML = (id, sym, label, min, max, step, v, stage = 2) => `
  <div class="slider" id="${id}-wrap" data-stage="${stage}">
    <div class="slider-top"><label for="${id}"><b>${sym}</b> · ${label}</label><output id="${id}-out" for="${id}">${numHTML(v)}</output></div>
    <div class="slider-body"><span aria-hidden="true">${numText(min)}</span>
      <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${v}" aria-valuetext="${sym} = ${numText(v)}" style="--fill:${((v - min) / (max - min)) * 100}%">
      <span aria-hidden="true">${numText(max)}</span></div>
  </div>`;
function syncSlider(id, sym, v) {
  const el = $('#' + id);
  if (Number(el.value) !== v) el.value = v;
  el.style.setProperty('--fill', `${((v - el.min) / (el.max - el.min)) * 100}%`);
  el.setAttribute('aria-valuetext', `${sym} = ${numText(v)}`);
  $(`#${id}-out`).innerHTML = numHTML(v);
}

  },
  startWalk() {
    this.stopWalk(true);
    const dirCap = () => { const m = this.s.m; return m > 0 ? 'Climbing uphill…' : m < 0 ? 'Walking downhill…' : 'Walking on flat ground…'; };
    const endCap = () => { const m = this.s.m; return m > 0 ? 'That was uphill: m is positive.' : m < 0 ? 'That was downhill: m is negative.' : 'Flat all the way: m is 0.'; };
    const finish = () => { this.walk = { caption: endCap(), endX: 8 }; this.placeHiker(8); setCaption(endCap()); announce(endCap()); };

    this.walk = { caption: dirCap() };
    setCaption(dirCap());
    announce(dirCap());
    const step = (now) => {
      const p = Math.min(1, (now - t0) / 3200);
      this.placeHiker(-8 + 16 * p);

      if (cap !== this.walk.caption) { this.walk.caption = cap; setCaption(cap); }

  },

    }
    const kind = near(v, l.m) ? 'correct' : l.m !== 0 && near(v, 1 / l.m) ? 'reciprocal' : near(v, -l.m) ? 'sign' : 'other';

    G.tri.innerHTML = this.shown() && l.kind !== 'coincident' ? this.triangleSVG(trace && !reduced()) : '';
    this.drawPoints();
    setDesc(`Point A at ${pointText(a)}, point B at ${pointText(b)}. A red line passes through A and B.${s.mission === 4 ? ' Both points stay on the dashed line y = 2x − 4.' : ''}`);
  },
  triangleSVG(trace) {
    const { a, b } = this.s, c = { x: b.x, y: a.y }, dx = b.x - a.x, dy = b.y - a.y;
    const L = (p, q) => Math.hypot(px(p.x) - px(q.x), py(p.y) - py(q.y));
    let h = '';
    if (dx !== 0 && dy !== 0) h += `<polygon class="tri" points="${px(a.x)},${py(a.y)} ${px(c.x)},${py(c.y)} ${px(b.x)},${py(b.y)}"/>`;
    if (dx !== 0) h += `<line class="run-seg ${trace ? 'trace' : ''}" style="--len:${L(a, c)}" x1="${px(a.x)}" y1="${py(a.y)}" x2="${px(c.x)}" y2="${py(c.y)}"/>`;
    if (dy !== 0) h += `<line class="rise-seg ${trace ? 'trace second' : ''}" style="--len:${L(c, b)}" x1="${px(c.x)}" y1="${py(c.y)}" x2="${px(b.x)}" y2="${py(b.y)}"/>`;
    // Run label: outside the triangle (opposite side to B), flipped near the grid edge.
    if (dx !== 0) {
      let below = dy >= 0;
      const yb = py(a.y) + 24, ya = py(a.y) - 12;
      if (below && yb > VIEW - PAD - 4) below = false; else if (!below && ya < PAD + 16) below = true;
      const xm = clamp((px(a.x) + px(c.x)) / 2, PAD + 44, VIEW - PAD - 44);
      h += `<text class="run-label" x="${xm}" y="${below ? yb : ya}" text-anchor="middle">across ${numText(dx)}</text>`;
    }
    if (dy !== 0) {
      let right = dx >= 0;
      if (right && px(c.x) + 80 > VIEW - PAD) right = false; else if (!right && px(c.x) - 80 < PAD) right = true;
      const ym = clamp((py(c.y) + py(b.y)) / 2 + 6, PAD + 16, VIEW - PAD - 6);
      h += `<text class="rise-label" x="${px(c.x) + (right ? 10 : -10)}" y="${ym}" text-anchor="${right ? 'start' : 'end'}">${dy > 0 ? 'up' : 'down'} ${Math.abs(dy)}</text>`;

  },
  // Points are created once and then updated in place so pointer capture and focus survive moves.
  drawPoints() {
    for (const k of ['a', 'b']) {
      let g = G.points.querySelector(`[data-pt=${k}]`);
      const K = k.toUpperCase(), p = this.s[k];
      if (!g) {
        g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', `pt pt-${k}`);
        g.dataset.pt = k;
        g.setAttribute('tabindex', '0');

          + `<text class="pt-label"></text>`;
        G.points.appendChild(g);
      }
      g.setAttribute('transform', `translate(${px(p.x)},${py(p.y)})`);

  // Live geometry update while moving (drag or key); evaluation happens in commit().
  tryMove(k, p) {
    const s = this.s, other = k === 'a' ? s.b : s.a, cur = s[k];
    if (p.x === other.x && p.y === other.y) return 'overlap';
    if (p.x === cur.x && p.y === cur.y) return false;
    s[k] = p;
    if (s.predict && (s.revealed || s.feedback || s.validation || s.prediction)) { this.resetPrediction(); this.renderPredict(); }
    else if (s.predict) $('#i-q').textContent = `The line passes through A ${pointText(s.a)} and B ${pointText(s.b)}. What is its gradient?`;
    this.draw();
    this.chips();
    this.renderWorking(false);
    return true;
  },
  commit(k) {
    const s = this.s;
    const g = G.points.querySelector(`[data-pt=${k}]`);
    if (g) { g.classList.remove('dropped'); void g.getBoundingClientRect(); g.classList.add('dropped'); }
    announce(`Point ${k.toUpperCase()} moved to ${pointText(s[k])}.`);
    if (s.mission === 4) {
      s.pairs = commitPair(s.pairs, s.a, s.b);
      const el = $('#pairs'); if (el) el.textContent = `Pairs tried: ${Math.min(3, s.pairs.length)} of 3`;
    }
    if (intermediateComplete(s.mission, s.a, s.b, s.pairs)) completeMission('intermediate');
  },
  key(e, k) {
    const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[e.key];
    if (!d) return;
    e.preventDefault();
    const s = this.s, p = s[k];
    const next = s.mission === 4 ? constrainedPoint(p.x + (d[0] || d[1]))
      : { x: clamp(p.x + d[0], FREE.min, FREE.max), y: clamp(p.y + d[1], FREE.min, FREE.max) };
    const r = this.tryMove(k, next);
    if (r === 'overlap') announce(`${k.toUpperCase()} cannot sit on top of the other point.`);
    else if (r) this.commit(k);
  },
  toUnits(e) {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const q = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: ux(q.x), y: uy(q.y) };
  },
  snap(u) {
    return this.s.mission === 4 ? constrainedPoint(u.x)
      : { x: clamp(Math.round(u.x), FREE.min, FREE.max), y: clamp(Math.round(u.y), FREE.min, FREE.max) };
  },
};

// Advanced — Equation Detective

const A = LEVEL.advanced = {
  resetArmed: false,
  get s() { return state.advanced; },
  ensure() { if (!this.s.challenge) state.advanced = freshChallenge(this.s, this.generate()); },
  generate() { return demo?.queue?.length ? demo.queue.shift() : CH.generate(this.s.type, Math.random, this.s.challenge); },
  panel() {
    this.ensure();
    const types = ['mixed', ...CH.TYPES];
    return `
      <div class="lvl-head" data-stage="1"><div class="lvl-title-row a-title-row"><h2 class="lvl-title" id="lvl-title" tabindex="-1">Equation Detective</h2>
        <span class="a-actions"><button class="btn quiet sm" type="button" id="a-new" aria-label="New challenge">New</button>
        <button class="btn quiet sm" type="button" id="a-reset" aria-label="Reset my score">Reset</button></span></div></div>
      <div class="a-toolbar" data-stage="1">
        <details class="disclosure type-picker" id="a-types"><summary>${I.chev}<span><b id="a-type-label"></b></span></summary>
          <div class="disclosure-body"><div class="types" role="group" aria-label="Challenge type">${types.map((t) =>
            `<button type="button" data-type="${t}" aria-pressed="${t === this.s.type}">${CH.TYPE_LABELS[t]}</button>`).join('')}</div></div></details>
        <div class="scores" id="a-scores"></div>
      </div>
      <div id="a-challenge" class="a-challenge"></div>`;
  },
  after() { this.scores(); this.renderChallenge(); },
  scores() {
    const s = this.s;
    const prev = this.lastScores || [];
    const vals = [['Points', s.points], ['Solved', s.solved], ['Streak', s.streak], ['Best', s.bestStreak, 'Best streak']];
    $('#a-scores').innerHTML = vals.map(([l, v, full], k) =>
      `<div class="score" ${full ? `aria-label="${full} ${v}"` : ''}><b class="${prev.length && prev[k] !== v ? 'pop' : ''}">${v}</b><span>${l}</span></div>`).join('');
    this.lastScores = vals.map((x) => x[1]);
    const ch = s.challenge;
    // the closed picker shows a short name so it never truncates beside the scores; the menu keeps full names
    if ($('#a-type-label') && ch) {
      $('#a-type-label').textContent = s.type === 'mixed' ? 'Mixed' : PICKER_SHORT[ch.type];
      $('#a-types > summary').title = (s.type === 'mixed' ? 'Mixed · ' : '') + CH.TYPE_LABELS[ch.type];
    }
  },
  caption() {
    const ch = this.s.challenge;
    if (!ch) return '';
    return { read: 'Find the equation of the red line.', two: this.s.locked ? 'Here is the line through the two points.' : 'No graph this time. Use the coordinates.',
      missing: `The red line is ${equationText(ch.m, ch.c)}.`, targets: 'Move the sliders until the line passes through both dots.' }[ch.type];
  },
  renderChallenge() {
    const s = this.s, ch = s.challenge, dis = s.locked ? 'disabled' : '';
    // Answer boxes sit inside the equation itself; once solved or revealed, the controls step
    // aside (.locked) and the worked solution takes their place, so nothing needs scrolling.
    const box = (id, key, label, ph) => `<label class="sr-only" for="${id}">${label}</label><input class="answer-box" id="${id}" data-input="${key}" placeholder="${ph}" autocomplete="off" spellcheck="false" inputmode="text" value="${s.inputs[key]}" ${dis}>`;
    let controls;
    if (ch.type === 'read' || ch.type === 'two') {
      controls = `<div class="answer-eq" data-stage="2"><i>y</i> = ${box('a-m', 'm', 'm, the gradient', 'm')}<i>x</i> + ${box('a-c', 'c', 'c, the y-intercept', 'c')}</div>`;
    } else if (ch.type === 'missing') {
      controls = `<div class="answer-eq" data-stage="2"><i>${ch.mode}</i> = ${box('a-v', 'v', ch.mode, '?')}</div>`;
    } else {
      controls = `${sliderHTML('a-sm', 'm', 'Gradient', -4, 4, 0.5, s.sliders.m)}${sliderHTML('a-sc', 'c', 'y-intercept', -8, 8, 1, s.sliders.c)}`;
    }
    const eqInline = ch.type === 'targets' ? `<span class="eq-inline" id="a-eq" aria-hidden="true">${equationHTML(s.sliders.m, s.sliders.c)}</span>` : '';
    const host = $('#a-challenge');
    host.classList.toggle('locked', s.locked);
    host.innerHTML = `
      <p class="q" id="a-q" data-stage="1">${CH.questionHTML(ch)}</p>
      <div class="a-controls">${controls}
        <div class="check-row" data-stage="2"><button class="btn primary" type="button" id="a-check" ${dis}>Check answer</button>${eqInline}<span class="attempts" id="a-att"></span></div>
      </div>
      <div class="notes" id="notes"></div>`;
    this.scores();
    if (ch.type === 'targets' && s.locked) for (const id of ['a-sm', 'a-sc']) $('#' + id).disabled = true;
    this.attempts();
    this.renderNotes();
  },
  attempts() {
    const s = this.s, left = 3 - s.attempts;
    $('#a-att').textContent = s.locked ? (s.feedback === 'correct' ? 'Solved.' : 'No attempts left.') : `${left} attempt${left === 1 ? '' : 's'} remaining`;
  },
  renderNotes() {
    const s = this.s, ch = s.challenge;
    let h = '';
    const hintNote = (close) => note('hint', 'Hint', `<p>${CH.HINTS[ch.type]}</p>`, { close });
    if (s.validation) h += note('hint', 'Type a number', `<p>${s.validation}</p>`);
    if (s.hint && !['notyet', 'similar'].includes(s.feedback)) {
      h += s.locked ? note('hint', 'Hint', '<p>You have finished this challenge. Press “Next challenge” for a new one.</p>', { close: true }) : hintNote(true);
    }
    const next = `<button class="btn primary" type="button" data-action="next-challenge">Next challenge</button>`;
    switch (s.feedback) {
      case 'correct': h += note('ok', 'Correct!', `<p>You earned ${s.earned} point${s.earned === 1 ? '' : 's'}.</p>${CH.workingHTML(ch)}${next}`); break;
      case 'notyet': h += note('hint', 'Not yet', `${s.comment ? `<p><b>${s.comment}</b></p>` : ''}<p>${CH.HINTS[ch.type]}</p><p>Try again.</p>`); break;
      case 'similar': // retained hint folded into the header; the worked example is stepped through
        h += note('info', 'Try a similar one first', `<p class="hint-line"><b>Hint:</b> ${CH.HINTS[ch.type]}</p>${CH.similarHTML(s.example)}
          <div class="ex-nav"><button class="btn quiet sm" type="button" data-action="ex-prev">‹ Back</button>
          <span class="ex-count" id="ex-count" aria-live="polite"></span>
          <button class="btn secondary sm" type="button" data-action="ex-next">Next step ›</button></div>`);
        break;
      case 'answer': h += note('bad', 'Here is the answer', `${CH.workingHTML(ch)}${next}`); break;
    }
    $('#notes').innerHTML = h;
    if (s.feedback === 'similar') this.exStep(0);
    corner.sync();
    updateMore();
  },
  // Show worked-example step i (others hidden); the closing line appears on the last step.
  exStep(i) {
    const items = $$('#notes .ex-work .steps > li');
    if (!items.length) return;
    this.exIndex = Math.max(0, Math.min(items.length - 1, i));
    items.forEach((li, k) => li.classList.toggle('ex-current', k === this.exIndex));
    const last = this.exIndex === items.length - 1;
    // the last step's prompt takes the counter's place, so the note never grows a line
    $('#ex-count').textContent = last ? 'Now use the same steps and try again.' : `Step ${this.exIndex + 1} of ${items.length}`;
    $('#ex-count').classList.toggle('ex-done', last);
    $('[data-action=ex-prev]').disabled = this.exIndex === 0;
    $('[data-action=ex-next]').hidden = last;
  },
  draw() {
    const s = this.s, ch = s.challenge;
    G.ref.innerHTML = G.tri.innerHTML = G.points.innerHTML = G.marks.innerHTML = '';
    svg.classList.toggle('hidden-graph', ch.type === 'two' && !s.locked);
    const dot = (p, label) => Math.abs(p.x) <= 8 && Math.abs(p.y) <= 8
      ? `<circle class="pt-dot" cx="${px(p.x)}" cy="${py(p.y)}" r="8"/><text class="pt-label" style="fill:var(--pa)" x="${px(p.x) + (p.x >= 4 ? -14 : 14)}" y="${py(p.y) + (p.y >= 6 ? 26 : -12)}" text-anchor="${p.x >= 4 ? 'end' : 'start'}">${label}</text>` : '';
    if (ch.type === 'read') G.line.innerHTML = lineSVG(ch.m, ch.c);
    else if (ch.type === 'two') {
      G.line.innerHTML = s.locked ? lineSVG(ch.m, ch.c) : '';
      if (s.locked) G.marks.innerHTML = dot(ch.p1, pointText(ch.p1)) + dot(ch.p2, pointText(ch.p2));
    } else if (ch.type === 'missing') {
      G.line.innerHTML = lineSVG(ch.m, ch.c);
      if (s.locked) G.marks.innerHTML = dot({ x: ch.x, y: ch.y }, pointText({ x: ch.x, y: ch.y }));
    } else {
      const { m, c } = s.sliders;
      G.line.innerHTML = lineSVG(m, c);
      G.marks.innerHTML = [ch.t1, ch.t2].map((t) => {
        const hit = CH.onLine(m, c, t), X = px(t.x), Y = py(t.y), cls = hit ? ' hit' : '';
        return `<circle class="target${cls}" cx="${X}" cy="${Y}" r="15"/><circle class="target-core${cls}" cx="${X}" cy="${Y}" r="4.5"/>`
          + (hit ? `<path class="target-check" d="M${X + 12},${Y - 24} l5,5 l10,-11"/>` : '')
          + `<text class="target-label${cls}" x="${X + (t.x > 0 ? -20 : 20)}" y="${Y + (t.y >= 6 ? 34 : -20)}" text-anchor="${t.x > 0 ? 'end' : 'start'}">${pointText(t)}${hit ? ' ✓' : ''}</text>`;
      }).join('');
    }
    let d = CH.describeForSR(ch);
    if (ch.type === 'targets') d += ` Your line is ${equationText(s.sliders.m, s.sliders.c)}. It passes through ${CH.hitCount(ch, s.sliders.m, s.sliders.c)} of the 2 dots.`;
    if (s.locked && ch.type !== 'targets') d += ` The answer: ${CH.answerText(ch)}.`;
    setDesc(d);
  },
  onSlide(which, v) {
    const s = this.s;
    if (s.locked || s.sliders[which] === v) return;
    const before = CH.hitCount(s.challenge, s.sliders.m, s.sliders.c);
    s.sliders[which] = v;
    syncSlider('a-s' + which, which, v);
    $('#a-eq').innerHTML = equationHTML(s.sliders.m, s.sliders.c);
    this.draw();
    const after = CH.hitCount(s.challenge, s.sliders.m, s.sliders.c);
    announce(`${equationText(s.sliders.m, s.sliders.c)}. ${after !== before ? `Passes through ${after} of 2 dots.` : ''}`, 600);
  },
  check() {
    let s = this.s;
    if (s.locked) return; // repeated clicks on a locked check are ignored
    const ch = s.challenge;
    const res = CH.check(ch, ch.type === 'targets' ? { ...s.sliders } : { ...s.inputs });
    if (!res.valid) {
      s.validation = res.message;
      this.renderNotes();
      $$('#a-challenge .answer-box').forEach((el) => { if (parseAnswer(el.value) === null) el.setAttribute('aria-invalid', 'true'); });
      announce(res.message);
      return;
    }
    $$('#a-challenge .answer-box').forEach((el) => el.removeAttribute('aria-invalid'));
    s = state.advanced = { ...recordAttempt(s, res), validation: null };
    s.comment = s.feedback === 'notyet' ? res.comment : null;
    if (s.feedback === 'similar') s.example = CH.similar(ch);
    if (s.feedback === 'correct' || s.feedback === 'answer') s.hint = false;
    persist();
    renderChrome();
    this.scores();
    if (s.locked) {
      $$('#a-challenge input').forEach((el) => { el.disabled = true; });
      $('#a-check').disabled = true;
      $('#a-challenge').classList.add('locked');
    }
    this.attempts();
    this.renderNotes();
    if (s.feedback === 'answer' && ch.type === 'targets') this.animateSliders(ch.m, ch.c);
    this.draw();
    setCaption(this.caption());
    if (!res.correct) { const row = $('#a-challenge .a-controls'); row?.classList.remove('shake'); void row?.offsetWidth; row?.classList.add('shake'); }
    const fb = { correct: () => { corner.react('nod'); chime('ok'); }, notyet: () => corner.react('retry'),
      similar: () => corner.react('retry'), answer: () => corner.react('retry') }[s.feedback];
    fb?.();
    const head = { correct: `Correct! You earned ${s.earned} point${s.earned === 1 ? '' : 's'}. ${CH.answerText(ch)}.`,
      notyet: `Not yet. ${s.comment || ''} Hint: ${CH.HINTS[ch.type]} Try again.`,
      similar: 'Not yet. Try a similar one first: a worked example with different numbers is shown below.',
      answer: `Here is the answer: ${CH.answerText(ch)}.` }[s.feedback];
    announce(head);
    if (s.locked) $('[data-action=next-challenge]')?.focus();
    else if (s.feedback === 'similar') $('#notes .note.info')?.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
  },
  animateSliders(m, c) {
    const s = this.s, from = { ...s.sliders };
    const apply = (mm, cc) => {
      s.sliders = { m: mm, c: cc };
      syncSlider('a-sm', 'm', mm); syncSlider('a-sc', 'c', cc);
      $('#a-eq').innerHTML = equationHTML(mm, cc);
      this.draw();
    };
    if (reduced()) return apply(m, c);
    const t0 = performance.now();
    const step = (now) => {
      if (state.screen !== 'advanced' || this.s.challenge?.type !== 'targets') return;
      const p = Math.min(1, (now - t0) / 700), e = 1 - (1 - p) ** 3;
      if (p < 1) { apply(Math.round((from.m + (m - from.m) * e) * 2) / 2, Math.round(from.c + (c - from.c) * e)); requestAnimationFrame(step); } else apply(m, c);
    };
    requestAnimationFrame(step);
  },
  newChallenge({ focus } = {}) {
    state.advanced = freshChallenge(this.s, this.generate());
    this.renderChallenge(); this.draw(); setCaption(this.caption());
    stageIn($('#a-challenge'));
    corner.reset();
    announce(`New challenge. ${plain(CH.questionHTML(this.s.challenge))}`);
    if (focus) ($('#a-challenge .answer-box') || $('#a-sm'))?.focus();
  },
  setType(t) {
    this.s.type = t;
    $('#a-types')?.removeAttribute('open');
    $$('[data-type]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.type === t)));
    persist();
    this.newChallenge();
  },
  reset() {
    const btn = $('#a-reset');
    if (!this.resetArmed) {
      this.resetArmed = true;
      btn.textContent = 'Confirm?';
      announce('Press Reset again to set all four scores to 0.');
      later('lvl-reset', 4000, () => { this.resetArmed = false; if ($('#a-reset')) $('#a-reset').textContent = 'Reset'; });
      return;
    }
    this.resetArmed = false; cancelTimers('lvl-reset');
    state.advanced = resetScore(this.s);
    btn.textContent = 'Reset';
    persist(); renderChrome(); this.scores();
    announce('Score reset. Points, solved, streak and best streak are all 0.');
  },
};

// =====================================================================================
// Dialogs (completion). User-dismissable, focus trapped, Escape closes, focus returns.
// =====================================================================================
let dialog = null;
function openDialog(html, { onClose } = {}) {
  closeDialog(false);
  const prev = document.activeElement;
  const root = document.createElement('div');
  root.className = 'scrim';
  root.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">${html}</div>`;
  $('#overlays').appendChild(root);
  dialog = { root, prev, onClose };
  $('#app').setAttribute('aria-hidden', 'true');
  root.addEventListener('click', (e) => { if (e.target === root) closeDialog(); });
  (root.querySelector('[data-autofocus]') || root.querySelector('button')).focus();
}
function closeDialog(restore = true) {
  if (!dialog) return;
  const { root, prev, onClose } = dialog;
  dialog = null;
  root.remove();
  $('#app').removeAttribute('aria-hidden');
  onClose?.();
  if (restore) (prev && document.contains(prev) ? prev : $('#lvl-title') || $('#main'))?.focus();
}
// No pop-up (owner): the level-done message appears in the mission card's success note and
// Fitila celebrates once in her corner.

  if (state.screen !== lvl) return;
  corner.react('cheer');
  announce(`All missions done. ${LEVEL_DONE}`);
}

const endDrag = (e) => {

// =====================================================================================

function runOpener() {
  return new Promise((resolve) => {

    $('#overlays').appendChild(el);

    };

      const v = el.querySelector('video');

      const begin = () => {
        if (started) return; started = true;
        el.classList.add('play');
        at(FLYIN.land * 1000, land);
        at(FLYIN.wave * 1000 + 2300, () => finish(false)); // she waves, holds, then the tour begins
      };
      v.addEventListener('playing', begin, { once: true });
      // If the browser will not play video (power saving, codecs), show her landed instead.
      const fallback = () => { if (started) return; v.replaceWith(Object.assign(new Image(), { className: 'op-video', src: ASSET.flyin_last, alt: '' })); started = true; el.classList.add('play'); land(); at(2600, () => finish(false)); };
      v.addEventListener('error', fallback, { once: true });

const CANCEL = Symbol('cancel');
let wt = null;

function makeClock() {
  const c = { t: 0, paused: false, cancelled: false, waiters: new Set(), anims: new Set(), held: [] };
  // Timer-driven (not paint-driven) so the tour keeps time even when frames are throttled.
  let last = performance.now();
  const tick = () => {
    const now = performance.now(), dt = Math.min(250, now - last); last = now;
    if (c.paused) return;
    c.t += dt;
    for (const w of [...c.waiters]) if (c.t >= w.at) { c.waiters.delete(w); w.res(); }
  };
  const iv = setInterval(tick, 30);
  c.sleep = (ms) => new Promise((res, rej) => {
    if (c.cancelled) return rej(CANCEL);
    c.waiters.add({ at: c.t + ms, res, rej });
  });
  c.pause = (on) => {
    c.paused = on;
    if (on) { c.held = document.getAnimations().filter((a) => a.playState === 'running'); c.held.forEach((a) => a.pause()); }
    else { c.held.forEach((a) => { try { a.play(); } catch { /* removed */ } }); c.held = []; }
  };
  c.cancel = () => {
    c.cancelled = true; clearInterval(iv);
    for (const w of c.waiters) w.rej(CANCEL);
    c.waiters.clear();
    for (const a of c.anims) { try { a.cancel(); } catch { /* gone */ } }
  };
  return c;
}

      await talk;
      await wait(900);
      ringOn(null);
    },
  ];

  async function finish() {
    if (finished) return;
    finished = true;
    clock.cancel();
    clearInterval(capTimer);
    audio.pause(); audio.removeAttribute('src');
    removeEventListener('scroll', placeRing);
    removeEventListener('resize', placeRing);
    removeEventListener('resize', fitCaption);
    stopTransient();
    root.remove();
    appEl.style.transform = '';
    document.body.style.paddingBottom = '';
    appEl.removeAttribute('aria-hidden');
    document.body.classList.remove('wt-active');
    $$('.wt-hide').forEach((e) => e.classList.remove('wt-hide'));
    // Restore exactly; first viewing ends at Welcome. The voice preference is kept.
    state = snapshot;
    state.prefs.onboardingSeen = true;
    if (first) { state.screen = 'welcome'; state.session.welcomeGestured = false; }
    demo = null; wt = null;
    persist();
    render();
    const back = !first && prevFocus && prevFocus !== document.body && document.contains(prevFocus) ? prevFocus : (first ? $('#welcome-title') : $('#btn-replay'));
    back?.focus();
    resolveDone();
  }

  $('#wt-skip').addEventListener('click', finish);
  if (stepMode) {
    let i = 0;
    const show = async (n) => {
      // Rebuild sandbox from scratch, then apply beats up to n instantly; narrate step n.
      state = initialState(); state.prefs = { ...snapshot.prefs }; state.session.welcomeGestured = true; state.beginner.mission = 5; demo = { queue: [], static: true };
      $$('.wt-hide').forEach((e) => e.classList.remove('wt-hide'));
      guideEl.hidden = true;
      for (let k = 0; k <= n; k++) await beats[k]();
      speak(n);
      $('#wt-back').disabled = n === 0;
      $('#wt-next').textContent = n === NARRATION.length - 1 ? 'Finish' : 'Next';
    };
    let busy = false;
    const goStep = async (n) => { if (busy) return; busy = true; i = n; try { await show(n); } finally { busy = false; } };
    $('#wt-next').addEventListener('click', () => { if (busy) return; if (i >= NARRATION.length - 1) return finish(); goStep(i + 1); });
    $('#wt-back').addEventListener('click', () => { if (i > 0) goStep(i - 1); });
    await show(0);
    $('#wt-next').focus();
  } else {
    const pauseBtn = $('#wt-pause');
    pauseBtn.addEventListener('click', () => {
      const on = !clock.paused;
      clock.pause(on);
      if (on) audio.pause(); else if (voiceOn && !blocked && !audio.ended) audio.play().catch(() => {});
      pauseBtn.textContent = on ? 'Resume' : 'Pause';
      pauseBtn.setAttribute('aria-pressed', String(on));
    });
    pauseBtn.focus();
    (async () => {
      try {
        for (const b of beats) { await b(); await wait(350); }
        finish();
      } catch (e) { if (e !== CANCEL) { console.error(e); finish(); } }
    })();
  }
  return done;
}

// =====================================================================================
// Boot: first visit → opener → walkthrough → Welcome. Return visit → last level.
// =====================================================================================
async function boot() {
  if (!state.prefs.onboardingSeen) {
    state.screen = 'welcome';
    state.session.welcomeGestured = true; // hold the greeting until Welcome is actually visible
    render();
    state.prefs.onboardingSeen = true; // skipping counts: never forced again
    persist();
    await runOpener();
    await runWalkthrough({ first: true });
  } else {
    state.screen = state.lastLevel || 'welcome';
    render();
  }
}
boot();

// Exposed for automated checks only (no effect on behaviour).
window.__gradientLab = { get state() { return state; }, get cornerClip() { return cornerClip; }, LEVEL, CH };

return {  };
})();

</script>
