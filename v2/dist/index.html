  box-shadow: 0 calc(var(--u) * 14) 0 #EE6A1E, 0 calc(var(--u) * 24) calc(var(--u) * 40) rgba(16, 40, 60, .18); }
.modal::after { content: ''; position: absolute; left: 0; right: 0; bottom: calc(var(--u) * -14); height: calc(var(--u) * 40); border-radius: 0 0 calc(var(--u) * 34) calc(var(--u) * 34); z-index: -1;
  background: linear-gradient(90deg, #E64E11, #F07A2D 55%, #F8AD65); }
.modal .inner { position: relative; overflow: hidden; border-radius: calc(var(--u) * 34); background: #fff; padding: calc(var(--u) * 40) calc(var(--u) * 32) calc(var(--u) * 26); }
.modal .decor { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.modal .art { position: relative; margin: 0 auto calc(var(--u) * 4); }
.modal .art .fitila { position: relative; }
.modal h2 { position: relative; font-family: var(--hand); font-weight: 400; font-size: calc(var(--u) * 56); line-height: 1.05; margin-bottom: calc(var(--u) * 10); -webkit-text-stroke: .03em currentColor; }
.modal p { position: relative; font-size: calc(var(--u) * 22); line-height: 1.35; margin-bottom: calc(var(--u) * 22); color: #314A62; }
.modal p.success { font-size: calc(var(--u) * 38); font-weight: 700; color: #179C4B; margin-bottom: calc(var(--u) * 26); }
.modal .btn { position: relative; width: calc(var(--u) * 294); height: calc(var(--u) * 62); margin: 0 auto; font-size: calc(var(--u) * 22); }
.modal small { position: relative; display: block; margin-top: calc(var(--u) * 24); font-size: calc(var(--u) * 19); color: #5C6F82; }
.confetti { position: fixed; left: 0; top: 0; width: 0; height: 0; z-index: 22; pointer-events: none; }
.confetti i { position: absolute; width: calc(var(--u) * 12); height: calc(var(--u) * 22); border-radius: calc(var(--u) * 4); }

/* =====================================================================================
   Motion (only with html.anim — removed for reduced motion)
   ===================================================================================== */
@keyframes popIn { 0% { opacity: 0; transform: scale(.4); } 60% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }
@keyframes riseIn { 0% { opacity: 0; transform: translateY(calc(var(--u) * 46)) scale(.96); } 100% { opacity: 1; transform: none; } }
@keyframes dropIn { 0% { opacity: 0; transform: translateY(calc(var(--u) * -40)); } 100% { opacity: 1; transform: none; } }
@keyframes frameIn { 0% { opacity: 0; transform: scale(.92); } 100% { opacity: 1; transform: none; } }
@keyframes hopIn { 0% { opacity: 0; transform: translateY(calc(var(--u) * 80)) scale(.86); } 55% { opacity: 1; } 100% { opacity: 1; transform: none; } }
@keyframes wordIn { 0% { opacity: 0; transform: translateY(calc(var(--u) * 14)) scale(.7); } 100% { opacity: 1; transform: none; } }
@keyframes letterIn { 0% { opacity: 0; transform: translateY(calc(var(--u) * 60)) rotate(-8deg) scale(.6); } 100% { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes draw { from { stroke-dashoffset: var(--len, 1200); } to { stroke-dashoffset: 0; } }
@keyframes bounce { 0%, 100% { transform: none; } 30% { transform: translateY(calc(var(--u) * -10)) scale(1.06); } 60% { transform: translateY(calc(var(--u) * 2)) scale(.98); } }
@keyframes nudge { 0%, 88%, 100% { transform: none; } 91% { transform: translateY(calc(var(--u) * -6)) scale(1.03); } 94% { transform: translateY(calc(var(--u) * 1)) scale(.99); } 97% { transform: translateY(calc(var(--u) * -2)); } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(calc(var(--u) * -12)); } 40% { transform: translateX(calc(var(--u) * 10)); } 60% { transform: translateX(calc(var(--u) * -6)); } 80% { transform: translateX(calc(var(--u) * 3)); } }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.18); opacity: .55; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(calc(var(--u) * -8)); } }
@keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0); opacity: 1; } 50% { transform: scale(.7) rotate(20deg); opacity: .6; } }
@keyframes modalIn { 0% { opacity: 0; transform: translateY(calc(var(--u) * 60)) scale(.86); } 100% { opacity: 1; transform: none; } }
@keyframes modalOut { to { opacity: 0; transform: translateY(calc(var(--u) * 30)) scale(.94); } }
@keyframes confetti { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
@keyframes squash { 0% { transform: none; } 35% { transform: scale(1.18, .82); } 70% { transform: scale(.94, 1.06); } 100% { transform: none; } }
@keyframes ghost { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
@keyframes bubbleOut { 0% { opacity: 1; visibility: visible; transform: none; } 100% { opacity: 0; visibility: hidden; transform: scale(.5); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes handTap { 0%, 100% { transform: translate(6px, 12px); } 45% { transform: translate(0, 0) scale(.9); } }
@keyframes handDrag { 0%, 100% { transform: translateX(-28px); } 50% { transform: translateX(28px); } }
@keyframes breathe { 0%, 100% { scale: 1; } 50% { scale: 1.06; } }
@keyframes hey { 0%, 100% { transform: none; } 20% { transform: translateY(calc(var(--u) * -22)) rotate(-4deg); } 40% { transform: translateY(0) scale(1.04, .96); } 60% { transform: translateY(calc(var(--u) * -10)) rotate(3deg); } 80% { transform: none; } }

/* staged entry: each element waits for its turn (--d, set per element), then springs in */
.anim .enter [data-in] { animation-delay: var(--d, 0ms); animation-fill-mode: backwards; }
.anim .enter [data-in="pop"] { animation-name: popIn; animation-duration: 640ms; animation-timing-function: var(--spring); }
.anim .enter [data-in="rise"] { animation-name: riseIn; animation-duration: 720ms; animation-timing-function: var(--spring); }
.anim .enter [data-in="drop"] { animation-name: dropIn; animation-duration: 700ms; animation-timing-function: var(--spring); }
.anim .enter [data-in="frame"] { animation-name: frameIn; animation-duration: 760ms; animation-timing-function: var(--spring-soft); }
.anim .enter [data-in="hop"] { animation-name: hopIn; animation-duration: 900ms; animation-timing-function: var(--spring); }
.anim .enter [data-in="fade"] { animation-name: fadeIn; animation-duration: 500ms; animation-timing-function: ease; }
.anim .bubble[data-in] { transform-origin: var(--origin, 50% 100%); }
.anim .enter .bubble .w { animation: wordIn 420ms var(--spring) backwards; animation-delay: calc(var(--d, 0ms) + 260ms + var(--i) * 70ms); }
.anim .enter .title-letters .ch { display: inline-block; animation: letterIn 760ms var(--spring) backwards; animation-delay: calc(var(--d, 0ms) + var(--i) * 45ms); }
.anim .enter .graph .draw { stroke-dasharray: var(--len, 1200); animation: draw 900ms cubic-bezier(.3, .7, .2, 1) backwards; animation-delay: calc(var(--d, 0ms) + 380ms); }
.anim .enter .graph .pt { transform-box: fill-box; transform-origin: center; animation: popIn 520ms var(--spring) backwards; animation-delay: calc(var(--d, 0ms) + 900ms + var(--i, 0) * 120ms); }
.anim .enter .deco [data-burst] { stroke-dasharray: 60; animation: draw 520ms ease-out backwards; animation-delay: calc(var(--d, 0ms) + 200ms); }

/* buttons and controls: lift on hover, squash on press, spring back */
.anim .btn, .anim .round, .anim .choice, .anim .chip-point, .anim .hintlink { transition: transform 420ms var(--spring), box-shadow 220ms ease, filter 160ms ease, background-color 200ms ease; }
.anim .btn:hover:not(:disabled), .anim .choice:hover, .anim .round:hover { transform: translateY(calc(var(--u) * -3)) scale(1.02); filter: brightness(1.04); }
.anim .btn:active:not(:disabled) { transform: translateY(calc(var(--u) * 5)) scale(.97, .94); box-shadow: 0 calc(var(--u) * 3) 0 var(--btn-edge); transition-duration: 90ms; }
.anim .btn.outline:active, .anim .round:active, .anim .choice:active { transform: scale(.94); transition-duration: 90ms; }
.anim .btn.cta { animation: nudge 4.5s ease-in-out 2.2s infinite; }
.anim .btn.cta:hover { animation: none; }
.anim .choice.selected { animation: squash 460ms var(--spring); }
.anim .field { transition: transform 360ms var(--spring); }
.anim .field:focus-within { transform: scale(1.03); }
.anim .wrong { animation: shake 460ms ease; }
.anim .slider .thumb { transition: transform 260ms var(--spring); }
.anim .slider input:hover ~ .thumb { transform: scale(1.12); }
.anim .slider input:active ~ .thumb { transform: scale(1.24); }
.anim .bump { animation: bounce 380ms var(--spring); }
.anim .tries .dots i { transition: background-color 300ms ease, transform 420ms var(--spring); }
.anim .tries .dots i.used { transform: scale(.82); }
.anim .drag-b > circle:first-child { transform-box: fill-box; transform-origin: center; animation: ghost 1.6s ease-in-out infinite; }
.anim #graph.dragging .drag-b > circle:first-child { animation: none; transform: scale(1.3); }
.anim .backdrop .flower { animation: spin 150s linear infinite, breathe 22s ease-in-out infinite; }
.anim .backdrop .flower.rev { animation-direction: reverse, normal; animation-duration: 190s, 26s; }
.anim .backdrop .flower.slow { animation-duration: 120s, 18s; }
.anim #scene .bubble.away { animation: bubbleOut 320ms ease-in forwards; }
.anim #scene .bubble.again { transform-origin: var(--origin, 50% 100%); animation: popIn 600ms var(--spring) backwards; }
.anim #scene .bubble.again .w { animation: wordIn 420ms var(--spring) backwards; animation-delay: calc(200ms + var(--i) * 70ms); }
.anim #scene .fitila.hey { animation: hey 900ms ease-in-out; }
.anim .graph .draw-now { stroke-dasharray: var(--len, 1200); animation: draw 1000ms cubic-bezier(.3, .7, .2, 1) both; }
.anim .graph .dash-in { animation: fadeIn 500ms ease both; }
.anim .graph .pt-now { transform-box: fill-box; transform-origin: center; animation: popIn 460ms var(--spring) both; }
.anim .tour-spot { transition: left 420ms var(--spring-soft), top 420ms var(--spring-soft), width 420ms var(--spring-soft), height 420ms var(--spring-soft); }
.anim .tour-hand { transition: left 380ms ease, top 380ms ease, opacity 200ms ease; }
.anim .tour-hand.tap svg { animation: handTap 1.2s ease-in-out infinite; }
.anim .tour-hand.drag svg { animation: handDrag 1.6s ease-in-out infinite; }
.anim .tour-tip { animation: popIn 420ms var(--spring) backwards; }
.anim .fitila.tappable { transition: transform 420ms var(--spring); }
.anim .fitila.tappable:hover { transform: translateY(calc(var(--u) * -6)) scale(1.02); }
.anim .target-halo { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
.anim .coord { animation: float 3.2s ease-in-out infinite; }
.anim .coord.purple { animation-delay: -1.6s; }
.anim .enter .coord { animation: riseIn 720ms var(--spring) backwards, float 3.2s ease-in-out infinite; animation-delay: var(--d, 0ms), calc(var(--d, 0ms) + 720ms); }
.anim .sparkle { transform-box: fill-box; transform-origin: center; animation: twinkle 1.8s ease-in-out infinite; }
.anim .modal { animation: modalIn 620ms var(--spring) backwards; }
.anim .modal.leaving { animation: modalOut 220ms ease forwards; }
.anim #scrim { animation: fadeIn 260ms ease; }
.anim .confetti i { animation: confetti 1100ms cubic-bezier(.2, .6, .4, 1) forwards; }
.anim #scene.leaving { animation: modalOut 200ms ease forwards; }

/* =====================================================================================
   Portrait screens (tablets upright, phones): the same elements regroup into a column
   ===================================================================================== */
@media (max-aspect-ratio: 23/20) {
  :root { --u: min(calc(100vw / 980), calc(100dvh / 1500)); }
  body { overflow: auto; }
  #app { position: static; overflow: visible; }
  #frame { position: relative; left: auto; top: auto; translate: none; width: calc(var(--u) * 980); height: auto; min-height: 100dvh; margin: 0 auto; padding: calc(var(--u) * 120) calc(var(--u) * 40) calc(var(--u) * 60); }
  #scene { position: relative; inset: auto; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 40); }
  #scene .L { position: relative; left: auto; top: auto; width: var(--pw, auto); height: auto; }
  #scene .grp { display: flex; width: 100%; justify-content: center; align-items: center; gap: calc(var(--u) * 28); flex-wrap: wrap; position: relative; }
  .header .brand { left: calc(var(--u) * 40); }
  .header #audio { left: calc(var(--u) * 800); }
  .header #exit { left: calc(var(--u) * 880); }
  .header #help { left: calc(var(--u) * 720); }
  .header #back { left: calc(var(--u) * 40); }
  .header.has-back .brand { left: calc(var(--u) * 124); }
  /* the board: graph full width, equation badge overlapping its top edge */
  #scene .g-board { flex-direction: column; gap: 0; }
  #scene .g-board .graph { width: 100%; aspect-ratio: var(--ar); }
  #scene .g-board .equation { margin-bottom: calc(var(--u) * -32); z-index: 5; width: auto; padding: 0 calc(var(--u) * 40); }
  /* Fitila beside her bubble, the bubble's tail pointing at her */
  #scene .g-buddy { flex-wrap: nowrap; align-items: center; }
  #scene .g-buddy .bubble { flex: 1 1 auto; max-width: calc(var(--u) * 560); min-height: calc(var(--u) * 110); padding: calc(var(--u) * 22) calc(var(--u) * 34); }
  #scene .bubble-text { white-space: normal; }
  #scene .g-buddy .bubble .tail { display: none; }
  /* Fitila stands to the left of her bubble here, so the tail points left, at her */
  #scene .g-buddy .bubble::after { content: ''; position: absolute; left: calc(var(--u) * -14); top: calc(50% - var(--u) * 14); width: calc(var(--u) * 28); height: calc(var(--u) * 28);
    background: #fff; border-left: calc(var(--u) * 2) solid #E4EBF1; border-bottom: calc(var(--u) * 2) solid #E4EBF1; transform: rotate(45deg); border-radius: 0 0 0 calc(var(--u) * 6); }
  #scene .bubble.offer { top: auto; bottom: auto; left: auto; right: auto; width: auto; }
  #scene .choice.pick { width: calc(var(--u) * 150); }
  #scene .g-buddy .fitila { flex: none; height: calc(var(--u) * 340) !important; width: calc(var(--u) * 340 * var(--ar)) !important; }
  #scene .g-buddy .round { position: absolute !important; right: 0; top: 0; }
  #scene .g-controls { flex-direction: column; }
  #scene .g-controls > .L, #scene .g-row > .L { width: var(--pw, calc(var(--u) * 560)); }
  #scene .g-row { flex-wrap: nowrap; }
  #scene .btn, #scene .field, #scene .choice, #scene .pill, #scene .measure, #scene .chip-point, #scene .target-count { height: calc(var(--u) * 88); }
  #scene .slider { width: calc(var(--u) * 880) !important; height: calc(var(--u) * 130) !important; }
  #scene .slider.compact { height: calc(var(--u) * 100) !important; }
  #scene .round { width: calc(var(--u) * 84) !important; height: calc(var(--u) * 84) !important; flex: none; }
  #scene .coord { height: calc(var(--u) * 260); }
  #scene .qcard { height: calc(var(--u) * 170); }
  #scene .g-buddy > .hand { flex: 1 1 auto; }
  #scene .g-choices { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 20); }
  #scene .g-choices .choice { width: auto; }
  #scene .deco-layer { display: none; }
  .backdrop .wide-only { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- How to play: spotlight, hand and Fitila's tip (sized in px so it stays readable on phones) ---------- */
.tour { position: fixed; inset: 0; z-index: 25; pointer-events: none; }
.tour-spot { position: fixed; border-radius: 22px; pointer-events: none; box-shadow: 0 0 0 200vmax rgba(14, 34, 54, .42), 0 0 0 4px #FFD54A, 0 0 24px 6px rgba(255, 213, 74, .55); }
.tour-hand { position: fixed; width: 44px; height: 52px; margin: -4px 0 0 -12px; pointer-events: none; opacity: 0; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .22)); }
.tour-hand svg { width: 100%; height: 100%; display: block; }
.tour-tip { position: fixed; left: 12px; top: 12px; pointer-events: auto; display: flex; align-items: flex-end; gap: 10px; width: min(460px, calc(100vw - 24px)); }
.tour-fitila { width: clamp(64px, 18vw, 92px); height: auto; flex: none; filter: drop-shadow(0 6px 10px rgba(14, 34, 54, .25)); }
.tour-body { position: relative; flex: 1; min-width: 0; background: #fff; border: 2px solid #E4EBF1; border-radius: 24px; padding: 16px 18px 14px; box-shadow: 0 12px 32px rgba(14, 34, 54, .28); }
.tour-body::before { content: ''; position: absolute; left: -11px; bottom: 26px; width: 18px; height: 18px; background: #fff; border-left: 2px solid #E4EBF1; border-bottom: 2px solid #E4EBF1; transform: rotate(45deg); border-radius: 0 0 0 4px; }
.tour-say { font-family: var(--hand); font-size: clamp(21px, 2.1vw, 27px); line-height: 1.15; color: var(--ink); -webkit-text-stroke: .02em currentColor; margin: 0 34px 12px 0; }
.tour-nice { color: var(--green); }
.tour-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tour-dots { display: flex; gap: 5px; margin-right: auto; }
.tour-dots i { width: 8px; height: 8px; border-radius: 50%; background: #D4DEE7; }
.tour-dots i.on { background: var(--blue-ink); }
.tour-skip { background: none; border: 0; color: #5C6F82; font: 600 15px var(--ui); padding: 8px 6px; }
.tour-tip .btn.small { height: 40px; font-size: 16px; padding: 0 16px; border-radius: 22px; box-shadow: 0 4px 0 var(--btn-edge); }
@media (max-width: 480px) {
  .tour-tip { gap: 6px; }
  .tour-body { padding: 14px 14px 12px; }
  .tour-nav { gap: 6px; }
  .tour-tip .btn.small { height: 38px; font-size: 15px; padding: 0 12px; }
  .tour-skip { padding: 8px 2px; font-size: 14px; }
}
.tour-tip .btn.small.outline { box-shadow: 0 3px 0 #D3ECFB; }
.tour-tip .btn:disabled { opacity: .4; }
.tour-close, .admin-close { position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border-radius: 50%; border: 2px solid #BFE0F5; background: #FAFDFF; color: #0B78B5; display: grid; place-items: center; padding: 0; }
.tour-close svg, .admin-close svg { width: 60%; height: 60%; }

/* ---------- admin preview (only ever added to the page for admins) ---------- */
/* a slim tab on the left edge, where no activity places its controls */
.admin-fab { position: fixed; left: 0; top: 50%; translate: 0 -50%; z-index: 30; writing-mode: vertical-rl; transform: rotate(180deg); font: 700 11px var(--ui); letter-spacing: .06em; color: #fff;
  background: #2C4566; border: 0; border-radius: 10px 0 0 10px; padding: 12px 4px; min-height: 64px; opacity: .85; }
.admin { position: fixed; left: 28px; top: 50%; translate: 0 -50%; z-index: 31; width: min(300px, calc(100vw - 40px)); max-height: calc(100dvh - 24px); overflow: auto; background: #fff; border: 2px solid #D3E5F2; border-radius: 18px;
  box-shadow: 0 12px 40px rgba(14, 34, 54, .3); padding: 14px; font-family: var(--ui); color: var(--ink); }
.admin-head { position: relative; font-size: 16px; padding: 6px 40px 8px 0; }
.admin-close { top: 0; right: 0; }
.admin-note { font-size: 13px; color: #4F6880; line-height: 1.45; margin-bottom: 10px; }
.admin-levels { display: grid; gap: 6px; margin-bottom: 10px; }
.admin-levels button { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 14px; border: 2px solid #D8E1E9; background: #fff; font: 600 15px var(--ui); color: var(--ink); }
.admin-levels button[aria-pressed="true"] { background: #3EA9EC; border-color: #1C7FC0; color: #fff; }
.admin .stars { display: flex; gap: 1px; width: 46px; }
.admin .stars svg { width: 14px; height: 14px; fill: #F5B400; }
.admin .admin-return { width: 100%; height: 44px; font-size: 15px; border-radius: 22px; }

/* ---------- worksheet: a tab on the right edge, and the practice graph that slides in ---------- */
.ws-tab { position: fixed; right: 0; top: 50%; translate: 0 -50%; z-index: 18; display: flex; flex-direction: row; align-items: center; gap: 8px;
  writing-mode: vertical-rl; padding: 16px 8px; border: 2px solid #2E95D0; border-right: 0; border-radius: 16px 0 0 16px;
  background: linear-gradient(90deg, var(--btn-top), var(--btn-bot)); color: #fff; font: 700 15px var(--ui); letter-spacing: .03em; box-shadow: -4px 4px 0 var(--btn-edge); }
.ws-tab svg { width: 22px; height: 22px; writing-mode: horizontal-tb; }
.ws-tab.pulse { background: linear-gradient(90deg, #FF8A3D, var(--orange)); border-color: #E2540D; box-shadow: -4px 4px 0 #B8430A; }
.worksheet { position: fixed; top: 12px; bottom: 12px; right: 12px; z-index: 19; width: min(440px, calc(100vw - 24px)); display: flex; flex-direction: column;
  background: #fff; border: 2px solid #D3E5F2; border-radius: 26px; box-shadow: -10px 14px 40px rgba(14, 34, 54, .25); padding: 16px 16px 14px;
  font-family: var(--ui); color: var(--ink); transform: translateX(calc(100% + 24px)); visibility: hidden; }
.worksheet.open { transform: none; visibility: visible; }
.ws-head { position: relative; font-size: 19px; padding: 6px 44px 4px 4px; }
.ws-close { position: absolute; right: 0; top: 0; width: 38px; height: 38px; border-radius: 50%; border: 2px solid #BFE0F5; background: #FAFDFF; color: #0B78B5; display: grid; place-items: center; padding: 0; }
.ws-close svg { width: 60%; height: 60%; }
.ws-help { font-size: 14px; color: #4F6880; margin: 2px 4px 8px; }
.ws-grid { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; border-radius: 16px; background: #F7FAFC; border: 2px solid #E3ECF3; cursor: crosshair; touch-action: none; }
.ws-grid svg { width: 100%; height: 100%; max-height: 100%; display: block; }
.ws-grid text { font-family: var(--ui); }
.ws-grid .ws-n { font-size: 14px; fill: #5C6F82; }
.ws-grid .ws-axis { font-size: 18px; font-style: italic; fill: var(--axis); }
.ws-grid .ws-tag { font-size: 17px; font-weight: 800; paint-order: stroke; stroke: #F7FAFC; stroke-width: 5px; }
.ws-grid .ws-pt { font-size: 15px; font-weight: 700; paint-order: stroke; stroke: #F7FAFC; stroke-width: 4px; }
.ws-read { min-height: 2.6em; font-size: 14px; color: #314A62; margin: 8px 4px; line-height: 1.35; }
.ws-tools { display: flex; gap: 10px; }

  7: 'm = change in y ÷ change in x. Then find where the line crosses the y-axis.',
  8: () => `Put x = ${fmt(q(8).x)} into y = ${exprHTML(q(8).m, q(8).c)}.`,

// ---------- state ----------
let page = 1, m = 0, c = 0, pointB = null, attempts = 3, selected = null, walkTimer = 0, modalOpen = null, moved = false;

// =====================================================================================
// Building blocks. box = [x, y, w, h] in design pixels; stage orders the staged entry.
// =====================================================================================
const STAGE_AT = [0, 0, 420, 900, 1350]; // ms: 1 board, 2 Fitila & bubble, 3 controls, 4 extras
let stageCount = {};
function stageDelay(stage) { stageCount[stage] = (stageCount[stage] || 0) + 1; return STAGE_AT[stage] + (stageCount[stage] - 1) * 80; }

}

const words = (s, start = 0) => s.split(/(\s+)/).map((w, i) => (/^\s+$/.test(w) ? w : `<span class="w" style="--i:${start + i / 2}">${w}</span>`)).join('');

// Speech bubble: pops out of its tail, words arrive one by one. tail = [baseX, baseY, tipX, tipY] (design px).
function bubble(lines, b, size, tail, { into, extra = '', stage = 2, delay } = {}) {
  const [x, y, w, h] = b;

  const html = lines.map((l) => { const s = words(l, n); n += l.split(/\s+/).length; return s; }).join('<br>');
  const el = make('div', 'bubble fs', `<div class="bubble-text">${html}${extra}</div>`);
  el.style.setProperty('--fs', size);

function success(message, next) {

function failure(message, fields = [], working = null) {

  const skill = SUPPORT[page];
  emit('attempt', { skill: skill || null, correct: false, attemptsLeft: attempts });
  if (skill && attempts === 1 && coach) { announce(message); wsNudge(); offerSupport(); return; }
  if (skill && attempts === 0 && working) {
    modal({ title: 'Here’s how it works', body: working, pose: 'think', action: 'Got it', onAction: () => freshQuestion(true) });
    return;
  }
  const out = attempts === 0;
  modal({ title: 'Almost!', body: out ? `${message} Let’s practise this step again.` : message + wsNudge(), pose: 'almost',
    action: out ? 'Practise again' : 'Try again', remaining: attempts, onAction: () => { if (out) { attempts = 3; renderTries(); } } });
}
const par = (v) => (v < 0 ? `(${fmt(v)})` : fmt(v));
const WORKING = {
  6: ({ m: mv, c: cv }) => `The line goes ${mv > 0 ? 'up' : 'down'} ${fmt(Math.abs(mv))} for every 1 step right, so m = ${fmt(mv)}. It crosses the y-axis at ${fmt(cv)}, so c = ${fmt(cv)}.`,
  7: ({ A, B }) => {
    const L = lineThrough(A, B);
    return `From A to B it goes ${B[1] >= A[1] ? 'up' : 'down'} ${fmt(Math.abs(B[1] - A[1]))} and across ${fmt(B[0] - A[0])}, so m = ${fmt(B[1] - A[1])} ÷ ${fmt(B[0] - A[0])} = ${fmt(L.m)}. Then c = y − m × x = ${fmt(A[1])} − ${par(L.m)} × ${par(A[0])} = ${fmt(L.c)}.`;
  },
  8: ({ m: mv, c: cv, x }) => `Put x = ${fmt(x)} into y = ${exprHTML(mv, cv)}: y = ${substitution(mv, cv, x)} = ${fmt(mv * x + cv)}.`,
  9: ({ c: cv }) => `The line crosses the y-axis, where x = 0, at y = ${fmt(cv)}. So the y-intercept is ${fmt(cv)}.`,
  11: ({ targets }) => {
    const [a, b] = [...targets].sort((p, r) => p[0] - r[0]), L = lineThrough(a, b);
    return `From (${a.map(fmt).join(', ')}) to (${b.map(fmt).join(', ')}) the line goes ${b[1] >= a[1] ? 'up' : 'down'} ${fmt(Math.abs(b[1] - a[1]))} and across ${fmt(b[0] - a[0])}, so m = ${fmt(L.m)}. It crosses the y-axis at ${fmt(L.c)}, so c = ${fmt(L.c)}.`;
  },
};
const substitution = (mv, cv, x) => `${mv === 1 ? par(x) : `${fmt(mv)} × ${par(x)}`} ${cv < 0 ? '−' : '+'} ${fmt(Math.abs(cv))}`;

let offerOnArrival = false;

function numeric(id) {

function check(fields, answers, next, message, working) {

  if (nums.every((v, i) => Math.abs(v - answers[i]) < 1e-6)) return success(message, next);
  const cRight = fields.includes('c-answer') && Math.abs(nums[0] - answers[0]) < 1e-6;

// =====================================================================================
// Fitila's bubble: the question stays on show. When the learner has been still for a while,
// "Tap me for a hint!" pops up for a moment and the question comes straight back. After a second
// wrong answer she offers to work through the idea together instead.
// =====================================================================================
const TIP_MS = 3000, IDLE_MS = 14000;
let coach = null;
function coachStop() {
  if (!coach) return;
  coach.timers.forEach(clearTimeout);
  clearTimeout(coach.idle);
  coach = null;
}
function coachStart({ quiet = false } = {}) {
  coachStop();
  const b = $('.g-buddy .bubble', scene), f = $('.g-buddy .fitila', scene);
  if (!b) return;
  const t = b.querySelector('.bubble-text');
  coach = { b, f, say: t.innerHTML, text: plainText(t), timers: [], idle: 0, offered: false, offering: false };
  const entry = quiet ? 0 : parseFloat(b.style.getPropertyValue('--d')) || 0;
  if (quiet) { bubbleSay(words('Your turn!')); coachLater(sayQuestion, 2600); }
  b.addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'together') { e.stopPropagation(); startGuided(); }
    else if (act === 'keep') { e.stopPropagation(); coach.offering = false; emit('support', { skill: SUPPORT[page], choice: 'keep-trying' }); sayQuestion(); armIdle(); }
    else if (b.classList.contains('tip')) helpMe();

  f.setAttribute('aria-label', `Fitila says: ${coach.text}${/[.!?]$/.test(coach.text) ? '' : '.'} Tap her for a hint.`);
  f.addEventListener('click', helpMe);
  f.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); helpMe(); } });

  copy.querySelectorAll('br').forEach((br) => br.replaceWith(' '));
  copy.querySelectorAll('div, p').forEach((block) => block.before(' ')); // separate blocks are separate words too
  copy.querySelectorAll('button').forEach((b) => b.remove());

  if (!grid) return;

  let s = `<svg viewBox="0 0 ${S} ${S}" aria-hidden="true"><defs><marker id="ws-ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M2 2L10 6L2 10Z" fill="var(--axis)"/></marker>
    <clipPath id="ws-clip"><rect x="${wsX(-R)}" y="${wsY(R)}" width="${wsX(R) - wsX(-R)}" height="${wsY(-R) - wsY(R)}"/></clipPath></defs>`;
  for (let v = -R; v <= R; v++) s += `<line x1="${wsX(v)}" y1="${wsY(-R)}" x2="${wsX(v)}" y2="${wsY(R)}" stroke="#DCE3EA" stroke-width="1.2"/><line x1="${wsX(-R)}" y1="${wsY(v)}" x2="${wsX(R)}" y2="${wsY(v)}" stroke="#DCE3EA" stroke-width="1.2"/>`;
  s += `<line x1="${wsX(-R) - 10}" y1="${wsY(0)}" x2="${wsX(R) + 12}" y2="${wsY(0)}" stroke="var(--axis)" stroke-width="2" marker-start="url(#ws-ah)" marker-end="url(#ws-ah)"/>`;
  s += `<line x1="${wsX(0)}" y1="${wsY(-R) + 10}" x2="${wsX(0)}" y2="${wsY(R) - 12}" stroke="var(--axis)" stroke-width="2" marker-start="url(#ws-ah)" marker-end="url(#ws-ah)"/>`;
  for (let v = -R; v <= R; v += 2) if (v) s += `<text x="${wsX(v)}" y="${wsY(0) + 20}" text-anchor="middle" class="ws-n">${fmt(v)}</text><text x="${wsX(0) - 8}" y="${wsY(v) + 5}" text-anchor="end" class="ws-n">${fmt(v)}</text>`;
  s += `<text x="${wsX(R) + 4}" y="${wsY(0) - 10}" class="ws-axis">x</text><text x="${wsX(0) + 10}" y="${wsY(R) - 2}" class="ws-axis">y</text>`;
  const pts = worksheet.pts, read = [];
  if (pts.length >= 2) {
    const a = pts[pts.length - 2], b = pts[pts.length - 1], d = [b[0] - a[0], b[1] - a[1]];
    s += `<line clip-path="url(#ws-clip)" x1="${wsX(a[0] - d[0] * 20)}" y1="${wsY(a[1] - d[1] * 20)}" x2="${wsX(a[0] + d[0] * 20)}" y2="${wsY(a[1] + d[1] * 20)}" stroke="var(--orange)" stroke-width="3.5" stroke-linecap="round"/>`;
    if (d[0] && d[1]) {
      const corner = [b[0], a[1]];
      s += `<line x1="${wsX(a[0])}" y1="${wsY(a[1])}" x2="${wsX(corner[0])}" y2="${wsY(corner[1])}" stroke="#1C8FD8" stroke-width="3" stroke-dasharray="8 6"/>`;
      s += `<line x1="${wsX(corner[0])}" y1="${wsY(corner[1])}" x2="${wsX(b[0])}" y2="${wsY(b[1])}" stroke="#12A066" stroke-width="3" stroke-dasharray="8 6"/>`;
      s += `<text x="${(wsX(a[0]) + wsX(corner[0])) / 2}" y="${wsY(a[1]) + (d[1] > 0 ? 22 : -10)}" text-anchor="middle" class="ws-tag" style="fill:#1C8FD8">across ${fmt(d[0])}</text>`;
      s += `<text x="${wsX(b[0]) + (d[0] > 0 ? 10 : -10)}" y="${(wsY(corner[1]) + wsY(b[1])) / 2 + 6}" text-anchor="${d[0] > 0 ? 'start' : 'end'}" class="ws-tag" style="fill:#12A066">up ${fmt(d[1])}</text>`;
    }
    read.push(d[0] ? `Across ${fmt(d[0])}, up ${fmt(d[1])}.` : 'That line goes straight up and down.');
  }
  pts.forEach((p, i) => {
    const col = i === pts.length - 1 ? '#7A4BD8' : '#1EA1E6';
    s += `<circle cx="${wsX(p[0])}" cy="${wsY(p[1])}" r="${u * 0.24}" fill="${col}" stroke="#fff" stroke-width="3"/><text x="${wsX(p[0]) + 10}" y="${wsY(p[1]) - 10}" class="ws-pt" style="fill:${col}">(${p.map(fmt).join(', ')})</text>`;
  });
  if (worksheet.cursor) s += `<circle cx="${wsX(worksheet.cursor[0])}" cy="${wsY(worksheet.cursor[1])}" r="${u * 0.42}" fill="none" stroke="#FFBD20" stroke-width="3" stroke-dasharray="6 4"/>`;
  grid.innerHTML = `${s}</svg>`;
  if (pts.length) read.unshift(`Points: ${pts.map((p) => `(${p.map(fmt).join(', ')})`).join(', ')}.`);
  $('.ws-read').textContent = read.join(' ');
  $('.ws-undo').disabled = $('.ws-clear').disabled = !pts.length;
}
function wsOpen(open) {
  const panel = $('#worksheet'), tab = $('#ws-tab');
  if (!panel) return;
  panel.classList.toggle('open', open);
  panel.inert = !open;
  tab.setAttribute('aria-expanded', String(open));
  if (open) {
    tab.classList.remove('pulse');
    emit('worksheet', { action: 'open' });
    setTimeout(() => $('.ws-grid', panel).focus({ preventScroll: true }), 50);
  } else if (panel.contains(document.activeElement)) tab.focus({ preventScroll: true });
}
// after a wrong answer: Fitila points the learner to the worksheet (or their book) and the tab pulses
function wsNudge() {
  if (!wsScreen(page)) return '';
  if (!$('#worksheet')?.classList.contains('open')) $('#ws-tab').classList.add('pulse');
  return ' Try it on your worksheet or in your book.';
}
// each screen gets a fresh worksheet; coming back to the same screen keeps it
function wsForPage(n) {
  $('#ws-tab').hidden = !wsScreen(n);
  if (!wsScreen(n)) wsOpen(false);
  if (worksheet.page !== n) { worksheet.page = n; worksheet.pts = []; worksheet.cursor = null; $('#ws-tab').classList.remove('pulse'); wsDraw(); }
}
wsSetup();

// ---------- keep the focused answer box (and its button) above an on-screen keyboard ----------
if (window.visualViewport) {
  const lift = () => {
    const el = document.activeElement, app = $('#app'), shift = Number(app.dataset.shift || 0);
    const typing = el?.matches?.('#scene input[type=text]');
    if (getComputedStyle(app).position !== 'fixed') { if (typing) el.scrollIntoView({ block: 'center' }); return; }
    const need = typing ? el.getBoundingClientRect().bottom + shift + 96 - (visualViewport.offsetTop + visualViewport.height) : 0;
    const next = Math.max(0, Math.round(need));
    if (next !== shift) { app.dataset.shift = next; app.style.translate = next ? `0 ${-next}px` : ''; }
  };
  visualViewport.addEventListener('resize', lift);
  addEventListener('focusin', () => setTimeout(lift, 250));
  addEventListener('focusout', () => setTimeout(lift, 120));
}

// ---------- header controls and start ----------
addEventListener('hashchange', () => { const n = Number(location.hash.slice(1)); if (PAGES[n] && n !== page) go(n); });
$('#audio').addEventListener('click', () => {
  const btn = $('#audio');
  if (!('speechSynthesis' in window)) { announce('Reading aloud is not available in this browser.'); return; }
  if (speechSynthesis.speaking) { speechSynthesis.cancel(); btn.setAttribute('aria-pressed', 'false'); return; }
  const say = modalOpen ? modalOpen.el.innerText : coach ? coach.text : $$('.grp > .hand', scene).map((e) => e.innerText).join('. ');
  const u = new SpeechSynthesisUtterance(say);
  u.onend = () => btn.setAttribute('aria-pressed', 'false');
  btn.setAttribute('aria-pressed', 'true');
  speechSynthesis.speak(u);
});
$('#help').addEventListener('click', () => startTour());
// Back: leaves guided practice or the walkthrough first, otherwise returns to the previous screen
$('#back').addEventListener('click', () => {
  if (tour) { endTour(false); return; }
  if (guided) { endGuided('back'); return; }
  let prev = trail.pop();
  while (prev === page) prev = trail.pop();
  go(prev ?? 1, { back: true });
});
$('#exit').addEventListener('click', () => modal({ title: 'Leave Gradient Lab?', body: 'You can come back to the welcome screen.', pose: 'think', action: 'Back to start', onAction: () => go(1) }));
document.documentElement.classList.toggle('anim', !reduced());
matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change', () => document.documentElement.classList.toggle('anim', !reduced()));
// wait for Patrick Hand and SN Pro so the first screen is laid out in the real type
const start = () => go(PAGES[Number(location.hash.slice(1))] ? Number(location.hash.slice(1)) : 1);
Promise.all([document.fonts.load('40px "Patrick Hand"'), document.fonts.load('600 30px "SN Pro"'), document.fonts.load('500 22px "SN Pro"')])
  .catch(() => {}).finally(start);
</script>
